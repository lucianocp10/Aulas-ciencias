function notes(i){return ['Apresente a questão central: como os animais produzem descendentes?','Compare com reprodução assexuada sem afirmar que reprodução sexuada sempre exige dois indivíduos.','Em humanos, a célula ovulada é o ovócito secundário; óvulo é empregado aqui como simplificação escolar.','As primeiras clivagens subdividem o volume celular. A diferenciação acontece posteriormente.','Não generalize ausência de cuidado parental ou baixa sobrevivência para toda espécie.','Pergunte: um animal aquático também pode ter fecundação interna? Sim.','A galinha é ovípara com fecundação interna e desenvolvimento direto.','Ovos comerciais geralmente não são fecundados. A presença de um ovo não implica presença de embrião.','Representação de um ovo fecundado em desenvolvimento. Saco vitelínico: absorção do vitelo; alantoide: resíduos e trocas gasosas; córion: membrana externa que participa das trocas com o alantoide.','Viviparidade existe fora dos mamíferos. A placenta aqui ilustrada conceitualmente é a de mamíferos placentários.','O termo ovoviviparidade é uma classificação escolar; há diversidade de nutrição embrionária.','A temperatura de incubação influencia a determinação sexual em tartarugas marinhas.','Semelhança não significa identidade: jovens ainda amadurecem.','Crisálida é a pupa; nem toda borboleta faz um casulo de seda.','A sequência não está em escala temporal ou anatômica. Não usar medidas fixas para determinar as fases.','A redução de competição é possível, não sua eliminação completa.','Seleção sexual envolve diferenças de sucesso reprodutivo. Evite atribuir intenção evolutiva aos comportamentos.'][i]}
