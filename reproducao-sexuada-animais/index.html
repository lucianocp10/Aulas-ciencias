ce nutrientes ao embrião. • Aves, tartarugas e muitos peixes são exemplos.","🥚","2 min"],["Uma estrutura, muitas funções","Explore o ovo em desenvolvimento","Gema/vitelo: reserva nutritiva. • Âmnio: envolve o embrião em líquido. • Casca: proteção e poros para trocas gasosas.","ovo","4 min"],["Desenvolvimento no corpo","Animais vivíparos","Os filhotes se desenvolvem no corpo materno e nascem vivos. • Nos mamíferos placentários, a placenta permite trocas de nutrientes, gases e resíduos. • O sangue materno e o fetal normalmente não se misturam diretamente.","🤰","2 min"],["O ovo permanece protegido","Ovoviviparidade","No modelo escolar, os ovos ficam retidos no corpo materno. • O embrião utiliza as reservas do vitelo. • Alguns peixes e répteis apresentam essa estratégia; ela não é uma etapa obrigatória rumo à viviparidade.","🥚","2 min"],["A praia também é um berçário","Tartarugas e ambiente","Iluminação artificial pode desorientar filhotes. • Veículos podem compactar a areia e destruir ninhos. • Resíduos ameaçam os animais: proteger a praia ajuda a proteger o ciclo de vida.","🐢","2 min"],["Crescer ou transformar?","Desenvolvimento direto e indireto","DIRETO: o jovem tem organização corporal semelhante à do adulto. • INDIRETO: há fase larval e metamorfose. • Metamorfose envolve mudanças de estrutura e função, além do crescimento.","🐣","3 min"],["Quatro fases, um ciclo","Metamorfose da borboleta","Ovo → lagarta → pupa → adulto. • A lagarta se alimenta e cresce. • Na pupa ocorre reorganização; a borboleta adulta participa da reprodução.","borboleta","4 min"],["Da água a uma nova forma","Do girino à rã","O girino apresenta cauda e vida aquática. • Durante a metamorfose surgem membros e a cauda é reabsorvida. • O adulto utiliza pulmões e pele nas trocas gasosas; há diversidade entre anfíbios.","ra","4 min"],["Recursos diferentes","Por que mudar de forma?","Lagartas de muitas espécies comem folhas; muitas borboletas adultas usam néctar. • Diferenças de alimentação e ambiente podem reduzir a competição entre fases. • Preservar uma espécie exige proteger todas as etapas do ciclo.","🌿","2 min"],["Sinais para encontrar parceiros","Comportamentos reprodutivos","Pavões: exibição visual. • Cervos: disputas entre machos. • Aves: danças de corte; anfíbios: vocalizações. Esses comportamentos podem influenciar o sucesso reprodutivo.","🦚","2 min"]];const quiz=[["O que é o zigoto?", ["Uma célula que produz espermatozoides.", "A célula formada pela união dos gametas.", "Um embrião com todos os órgãos.", "Uma reserva alimentar do ovo."], 1, "O zigoto é a célula formada na fecundação."], ["A galinha põe ovos. Sua fecundação é…", ["Externa, pois o ovo fica no ambiente.", "Externa, pois o pintinho nasce do ovo.", "Interna, pois os gametas se encontram no corpo.", "Assexuada, pois o embrião fica fora da mãe."], 2, "O local do encontro dos gametas define o tipo de fecundação."], ["Na ovoviviparidade estudada, o embrião…", ["Usa o vitelo de um ovo retido no corpo materno.", "Usa o vitelo de um ovo depositado no ambiente.", "Recebe todo o alimento pela placenta.", "Não precisa de nutrientes."], 0, "O ovo é retido no corpo e suas reservas nutrem o embrião."], ["Qual é a sequência da metamorfose da borboleta?", ["Ovo → pupa → lagarta → adulto.", "Ovo → lagarta → adulto → pupa.", "Lagarta → ovo → pupa → adulto.", "Ovo → lagarta → pupa → adulto."], 3, "A lagarta é a larva; a pupa antecede a fase adulta."], ["Alimentos diferentes para larvas e adultos podem…", ["Impedir a reprodução.", "Reduzir a competição por alimento.", "Eliminar todos os predadores.", "Eliminar a necessidade de alimento."], 1, "O uso de recursos distintos pode reduzir a competição entre fases."]];

const sperm=(x)=>'<g class="'+(intro?'gamete-swim':'cell-appear')+'"><path d="M'+(x-20)+' 120q-30 -28 -55 0t-55 0" fill="none" stroke="#74e5d1" stroke-width="5" stroke-linecap="round"/><ellipse cx="'+x+'" cy="120" rx="21" ry="12" fill="#76ead3"/><ellipse cx="'+(x+2)+'" cy="120" rx="9" ry="6" fill="#47769d"/></g>';
let drawing='';
if(intro||step<2){drawing=egg(570,120,68)+sperm(step===1?480:255);
if(intro)drawing+='<text x="395" y="135" fill="#eff8ff" font-size="50" text-anchor="middle">+</text>';
drawing+='<g fill="#f5f9ff" font-size="26" text-anchor="middle"><text x="220" y="235">Espermatozoide</text><text x="570" y="235">Óvulo</text></g>';
if(intro)drawing+='<path d="M170 260v15h450v-15M395 275v15" fill="none" stroke="#64dfbd" stroke-width="3"/><text x="395" y="325" text-anchor="middle" fill="#64dfbd" font-size="30">Gametas · células reprodutivas</text>';
}else if(step===2){drawing='<g class="cell-appear">'+egg(400,135,80)+'</g><text x="400" y="265" text-anchor="middle" fill="#73e6cd" font-size="30">Zigoto · 1 célula</text>';}
else{const cells=step===3?[[370,135,34],[440,135,34]]:step===4?[[370,102,31],[436,102,31],[370,168,31],[436,168,31]]:[[350,104,23],[400,104,23],[450,104,23],[350,154,23],[400,154,23],[450,154,23],[375,204,23],[425,204,23]];
drawing='<circle cx="400" cy="147" r="98" fill="none" stroke="#d5e4f4" stroke-opacity=".4" stroke-width="3"/><g class="cell-appear">'+cells.map(v=>egg(...v)).join('')+'</g><text x="400" y="285" text-anchor="middle" fill="#73e6cd" font-size="30">'+(2**(step-2))+' células</text>';
}
return '<svg viewBox="0 0 800 350" role="img" aria-label="'+(intro?'Espermatozoide mais óvulo: ambos são gametas':developmentLabels[step])+'"><defs><radialGradient id="cellgold"><stop stop-color="#ffe6a3"/><stop offset="1" stop-color="#e99c48"/></radialGradient></defs>'+drawing+'</svg>';
}
function renderGametes(detailed){
$('main').innerHTML='<section class="gamete-slide"><div class="eyebrow">'+(detailed?'Fecundação e desenvolvimento':'Reprodução sexuada')+'</div><h1>'+ (detailed?'Do zigoto às primeiras divisões':'O encontro dos gametas')+'</h1>'+
(detailed?'<p class="gamete-definition">A fecundação forma o <strong>zigoto</strong>, que passa por divisões celulares sucessivas.</p>':'<p class="gamete-definition">Na reprodução sexuada, são produzidas células reprodutivas, os <strong>gametas</strong>, que se unem e formam uma nova célula. Essa união é chamada <strong>fecundação</strong>.</p>')+
'<div class="gamete-stage" id="gametePanel"><div id="gameteVisual"></div>'+(detailed?'<p id="sequenceCaption" class="sequence-caption" aria-live="polite"></p><div class="controls"><button id="sequenceBack">← Etapa anterior</button><button id="sequencePlay">Reproduzir sequência</button><button id="sequenceNext">Próxima etapa →</button><button id="sequenceReset">Reiniciar</button></div>':'<button id="gametePause">Pausar animação</button>')+'</div><p class="caption">Representação esquemática, fora de escala.</p>'+(detailed?'<details><summary>Notas do professor</summary><p>O material genético dos gametas contribui para a formação do zigoto. As clivagens aumentam o número de células sem crescimento proporcional do volume total inicial. A sequência é simplificada; a organização das células varia entre espécies.</p></details>':'')+'</section>';
stage=0;
function update(){ $('gameteVisual').innerHTML=gameteDrawing(stage,!detailed);if(detailed){$('sequenceCaption').textContent=developmentLabels[stage];$('sequenceBack').disabled=stage===0;$('sequenceNext').disabled=stage===5;}}
update();
if(!detailed){$('gametePause').onclick=()=>{let p=$('gametePanel');let stopped=p.classList.toggle('freeze');$('gametePause').textContent=stopped?'Retomar animação':'Pausar animação'};return;}
function stop(){clearInterval(sequenceTimer);sequenceTimer=null;$('sequencePlay').textContent='Reproduzir sequência';}
$('sequenceNext').onclick=()=>{stop();stage=Math.min(5,stage+1);update()};
$('sequenceBack').onclick=()=>{stop();stage=Math.max(0,stage-1);update()};
$('sequenceReset').onclick=()=>{stop();stage=0;update()};
$('sequencePlay').onclick=()=>{if(sequenceTimer){stop();return;}if(stage===5)stage=0;update();$('sequencePlay').textContent='Pausar sequência';sequenceTimer=setInterval(()=>{stage++;update();if(stage===5)stop()},2500)};
}

function notes(i){return ['Apresente a questão central: como os animais produzem descendentes?','Compare com reprodução assexuada sem afirmar que reprodução sexuada sempre exige dois indivíduos.','Em humanos, a célula ovulada é o ovócito secundário; óvulo é empregado aqui como simplificação escolar.','As primeiras clivagens subdividem o volume celular. A diferenciação acontece posteriormente.','Não generalize ausência de cuidado parental ou baixa sobrevivência para toda espécie.','Pergunte: um animal aquático também pode ter fecundação interna? Sim.','A galinha é ovípara com fecundação interna e desenvolvimento direto.','Ovos comerciais geralmente não são fecundados. A presença de um ovo não implica presença de embrião.','Representação de um ovo fecundado em desenvolvimento. Saco vitelínico: absorção do vitelo; alantoide: resíduos e trocas gasosas; córion: membrana externa que participa das trocas com o alantoide.','Viviparidade existe fora dos mamíferos. A placenta aqui ilustrada conceitualmente é a de mamíferos placentários.','O termo ovoviviparidade é uma classificação escolar; há diversidade de nutrição embrionária.','A temperatura de incubação influencia a determinação sexual em tartarugas marinhas.','Semelhança não significa identidade: jovens ainda amadurecem.','Crisálida é a pupa; nem toda borboleta faz um casulo de seda.','A sequência não está em escala temporal ou anatômica. Não usar medidas fixas para determinar as fases.','A redução de competição é possível, não sua eliminação completa.','Seleção sexual envolve diferenças de sucesso reprodutivo. Evite atribuir intenção evolutiva aos comportamentos.'][i]}
function stages(k){return {gametas:['Óvulo e espermatozoide','Aproximação dos gametas','Fecundação: formação do zigoto'],divisao:['Zigoto','Duas células','Quatro células','Oito células'],ovo:['Casca: proteção','Clara: água e proteínas','Vitelo: reserva nutritiva','Embrião e âmnio: proteção em líquido'],ra:['Girino com cauda','Membros posteriores','Quatro membros','Rã: cauda reabsorvida'],borboleta:['Ovo','Lagarta','Pupa / crisálida','Borboleta adulta']}[k]}
function model(k){dispose();$('stage').textContent=stages(k)[stage];if(k==='borboleta'||!window.THREE){$('art').innerHTML=illustration(k==='borboleta'?['🥚','🐛','🌿','🦋'][stage]:k==='ra'?'🐸':'🥚');if(!window.THREE&&k!=='borboleta')$('art').insertAdjacentHTML('beforeend','<p class="caption">Vista ilustrada · 3D indisponível</p>');return}try{const T=window.THREE;scene=new T.Scene();camera=new T.PerspectiveCamera(40,1,0.1,100);camera.position.set(0,1,8);camera.lookAt(0,0,0);renderer=new T.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('art').replaceChildren(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x27465d,2));let light=new T.DirectionalLight(0xffffff,2);light.position.set(3,5,5);scene.add(light);group=new T.Group();scene.add(group);
function ball(x,y,z,r,color,sx=1,sy=1,sz=1){let m=new T.Mesh(new T.SphereGeometry(r,40,28),new T.MeshStandardMaterial({color,roughness:.4}));m.position.set(x,y,z);m.scale.set(sx,sy,sz);group.add(m);return m}
if(k==='gametas'){ball(0,0,0,1.1,0xf4ba62);ball(0,0,1,0.3,0xc26286);if(stage<2){let x=stage===0?-2.6:-1.4;ball(x,0,0,.2,0x66dfd1);let curve=new T.CatmullRomCurve3([new T.Vector3(x-.1,0,0),new T.Vector3(x-.5,.2,0),new T.Vector3(x-1,-.2,0)]);group.add(new T.Mesh(new T.TubeGeometry(curve,24,.035,8,false),new T.MeshStandardMaterial({color:0x66dfd1})))}}
if(k==='divisao'){let n=2**stage;for(let i=0;i<n;i++){let a=i/n*Math.PI*2;ball(n===1?0:Math.cos(a)*.9,n===1?0:Math.sin(a)*.9,0,n===1?1.2:.9/Math.cbrt(n),i%2?0x71ddcb:0xf2bd66)}}
if(k==='ovo'){if(stage===0)ball(0,0,0,1.45,0xf5e4c8,1,1.3,1);else{let white=ball(0,0,0,1.4,0xe3f4fa,1,1.3,.5);white.material.transparent=true;white.material.opacity=.3;ball(0,-.25,.3,.8,0xf4b634);if(stage===3){let am=ball(.15,.5,.7,.5,0x65d9dc);am.material.transparent=true;am.material.opacity=.45;ball(.15,.5,1,.28,0xe58d91,1,.65,1)}}}
if(k==='ra'){ball(0,0,0,.75,0x64ba85,1.3,.65,.8);ball(-.65,.22,.4,.1,0x172d32);ball(-.65,.22,-.4,.1,0x172d32);if(stage<3)ball(1,0,0,.65,0x64ba85,stage===2?.6:1.8,.18,.25);if(stage>0)for(let z of [-.55,.55])ball(.4,-.45,z,.38,0x89ca67,1,.4,1);if(stage>1)for(let z of [-.5,.5])ball(-.5,-.4,z,.25,0x89ca67,.5,1,1)}
let down=false,last=0;renderer.domElement.onpointerdown=e=>{down=true;last=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>down=false;renderer.domElement.onpointermove=e=>{if(down){angle+=(e.clientX-last)*.01;last=e.clientX}};function draw(){if(!renderer)return;const w=$('art').clientWidth,h=360;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(!paused&&!reduced&&!down)angle+=.003;group.rotation.y=angle;renderer.render(scene,camera);raf=requestAnimationFrame(draw)}draw()}catch(e){$('art').innerHTML=illustration(k==='ra'?'🐸':'🥚')}}
function go(n){current=Math.max(0,Math.min(22,n));render()}$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('menu').onchange=e=>go(+e.target.value);document.onkeydown=e=>{if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}};$('motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);$('motion').textContent=reduced?'Ativar movimento':'Reduzir movimento'};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};render();let lib=document.createElement('script');lib.src='https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js';lib.onload=()=>{if(current<17&&['gametas','divisao','ovo','ra'].includes(slides[current][3]))model(slides[current][3])};document.head.append(lib);
