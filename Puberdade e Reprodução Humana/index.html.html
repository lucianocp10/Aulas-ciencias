<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puberdade, Hormônios e Ciclo Menstrual — Ciências · 8º Ano</title>
<style>
:root{
  color-scheme:dark;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#07192b;
  --panel:#0d2740;
  --card:#11324f;
  --txt:#f3f8ff;
  --mut:#b8d4e3;
  --accent:#4ce5c4;
  --gold:#ffcf6e;
  --fem:#ff85ae;
  --masc:#5cc8ff;
  --ok:#156b50;
  --bad:#7a3345;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at 85% 12%,#144d5e 0%,transparent 55%),
             radial-gradient(circle at 12% 85%,#1b2e59 0%,transparent 55%),
             var(--bg);
  color:var(--txt);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

/* Partículas suaves no fundo */
.bg-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-particles i{
  position:absolute;bottom:-40px;border-radius:50%;
  border:2px solid #4ce5c428;background:#4ce5c40c;
  animation:riseUp linear infinite;
}
.bg-particles i:nth-child(2n){border-color:#ffcf6e28;background:#ffcf6e0a}
.bg-particles i:nth-child(3n){border-color:#ff85ae28;background:#ff85ae0a}
@keyframes riseUp{to{transform:translateY(-115vh) rotate(120deg)}}

header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:12px 4vw;
  background:#061423d8;backdrop-filter:blur(10px);
  border-bottom:1px solid #ffffff1e;font-size:14px;
}
header nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header select{max-width:310px;min-width:170px}
button,select{
  font:inherit;background:#163b52;color:#fff;
  border:1px solid #6b93a8;border-radius:12px;
  padding:8px 14px;cursor:pointer;
  transition:background .2s,border-color .2s,transform .12s;
}
button:hover:not(:disabled){background:#22617a;border-color:var(--accent)}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold)}
button:disabled{opacity:.38;cursor:default}
progress{width:100%;height:6px;display:block;accent-color:var(--accent);background:#0c253d;border:none;position:relative;z-index:19}

main{
  position:relative;z-index:1;
  flex:1;width:100%;max-width:1220px;margin:0 auto;
  padding:2.5vh 4.5vw 4.5vh;
  display:flex;flex-direction:column;justify-content:center;
}
.slide-enter{animation:slideFade .45s cubic-bezier(.16,1,.3,1)}
@keyframes slideFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.eyebrow{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  color:var(--accent);letter-spacing:2px;text-transform:uppercase;
  font-weight:700;font-size:12.5px;
}
.tag{
  background:var(--gold);color:#142230;
  padding:3px 10px;border-radius:999px;font-size:11.5px;
  font-weight:800;letter-spacing:.4px;
}
.story-link{
  font-size:13px;color:#b2f5e6;background:#113a4f;
  border:1px solid #4ce5c444;padding:3px 12px;border-radius:999px;
  text-transform:none;letter-spacing:0;font-weight:500;
}
h1{font-size:clamp(28px,3.8vw,52px);line-height:1.1;margin:10px 0 18px}
h2{font-size:clamp(20px,2.4vw,30px);margin:0 0 10px}

.layout{display:grid;grid-template-columns:.92fr 1.15fr;gap:3vw;align-items:center}
.points{display:flex;flex-direction:column;gap:12px}
.pt{
  background:#0c253bcc;border:1px solid #4f7b9444;border-left:4px solid var(--accent);
  border-radius:16px;padding:14px 16px;
  font-size:clamp(17px,1.65vw,22px);line-height:1.4;
}
.pt strong{color:var(--gold)}
.pt.fem{border-left-color:var(--fem)}
.pt.masc{border-left-color:var(--masc)}

.art{
  background:linear-gradient(155deg,#0d2a42cc,#081d31e6);
  border:1px solid #6fa3bd38;border-radius:26px;
  padding:18px;min-height:350px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 16px 40px #00000044;position:relative;overflow:hidden;
}
.art svg{width:100%;max-height:360px;display:block}
.caption{
  font-size:clamp(15px,1.4vw,19px);color:var(--gold);
  text-align:center;margin:12px 0 0;font-weight:600;min-height:1.4em;
}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.pill-btn.active{background:#1f6f82;border-color:var(--gold);box-shadow:0 0 0 2px #ffcf6e44}

/* CAPA ANIMADA */
.cover{text-align:center;padding:10px 0}
.cover h1{font-size:clamp(34px,5vw,64px);letter-spacing:-1px;margin:10px auto 10px}
.cover h1 span{color:var(--accent)}
.cover-sub{color:var(--mut);font-size:clamp(18px,2.1vw,25px);max-width:760px;margin:0 auto 22px;line-height:1.35}
.cover-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:860px;margin:0 auto 18px}
.c-card{
  background:linear-gradient(150deg,#123d56,#091f33);
  border:1px solid #59879e55;border-radius:20px;padding:14px 12px;
  transition:transform .25s,border-color .25s;
}
.c-card:hover{transform:translateY(-5px);border-color:var(--accent)}
.c-card svg{width:100%;height:125px;display:block}
.c-card h3{margin:8px 0 2px;font-size:18px;color:#fff}
.c-card p{margin:0;font-size:13.5px;color:var(--mut)}
.cover-banner{
  max-width:740px;margin:10px auto 18px;
  background:#0a2236cc;border:1px solid #4ce5c438;border-radius:20px;padding:10px 16px;
}
.cover-banner svg{width:100%;height:88px;display:block}
.start-btn{
  background:linear-gradient(135deg,#198270,#26a68d);border:2px solid #7cf2d8;
  font-size:20px;font-weight:700;padding:13px 30px;border-radius:16px;
  box-shadow:0 8px 24px #19827055;
}
.start-btn:hover{background:linear-gradient(135deg,#219984,#2ec2a5)}

/* Cards & Grids */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{
  background:#0c253bcc;border:1px solid #547e9655;border-radius:20px;padding:18px;
}
.card.fem{border-color:#ff85ae88}
.card.masc{border-color:#5cc8ff88}
.card.mint{border-color:#4ce5c488}
.card h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,23px)}
.card ul{margin:0;padding-left:18px}
.card li{font-size:clamp(16px,1.45vw,19px);line-height:1.4;margin:7px 0}

/* Tabela */
table{width:100%;border-collapse:collapse;background:#0c253b;border-radius:16px;overflow:hidden}
th,td{padding:12px 14px;border:1px solid #264963;text-align:left;font-size:clamp(15px,1.4vw,18px)}
th{background:#143c57;color:var(--gold)}

/* Simulador do Ciclo */
.sim-box{background:#0b2338dd;border:1px solid #55849c55;border-radius:24px;padding:18px}
.slider-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.slider-row input[type=range]{flex:1;min-width:180px;accent-color:var(--gold);cursor:pointer}
.day-pill{background:var(--gold);color:#122230;font-weight:800;padding:6px 14px;border-radius:12px;font-size:18px}
.horm-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.hbar{background:#081a2c;border:1px solid #2b4f69;border-radius:12px;padding:8px 10px;text-align:center}
.hbar-track{height:64px;display:flex;align-items:flex-end;justify-content:center;margin:6px 0}
.hbar-fill{width:26px;border-radius:8px 8px 3px 3px;transition:height .25s ease}
.hbar span{font-size:12px;font-weight:700;display:block}

/* Quiz */
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.option{text-align:left;padding:18px 20px;font-size:clamp(17px,1.65vw,21px);line-height:1.35}
.selected{border:3px solid var(--gold)}
.correct{background:var(--ok)!important;border-color:#68ebc5}
.wrong{background:var(--bad)!important;border-color:#ff8fa3}
.feedback{
  margin-top:14px;padding:14px 18px;border-radius:14px;
  background:#0e2e45;border-left:4px solid var(--accent);
  font-size:clamp(17px,1.65vw,21px);color:#bdf5e6;
}

/* Revisão Final */
.rev-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rev-card{background:#0c253b;border:1px solid #4d789155;border-radius:18px;padding:16px}
.rev-card p{margin:0 0 8px;font-size:17px;line-height:1.4}
details{background:#123752;border-radius:10px;padding:9px 12px;font-size:15px;color:#d0eaf8}
summary{cursor:pointer;font-weight:700;color:var(--gold)}

/* ANIMAÇÕES VETORIAIS */
@keyframes pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.1);opacity:1}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes dashFlow{to{stroke-dashoffset:-32}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes swimWave{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-4px)}}
@keyframes dropFall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(32px);opacity:0}}
@keyframes growBar{0%,100%{transform:scaleY(.88)}50%{transform:scaleY(1.06)}}
.a-pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-float{animation:floatY 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-flow{stroke-dasharray:8 8;animation:dashFlow 1.1s linear infinite}
.a-spin{animation:spinSlow 26s linear infinite;transform-box:fill-box;transform-origin:center}
.a-swim{animation:swimWave 1.9s ease-in-out infinite}
.a-drop{animation:dropFall 1.4s ease-in infinite}
.a-grow{animation:growBar 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}

@media(max-width:860px){
  .layout,.grid-2,.grid-4,.cover-cards,.options,.rev-grid{grid-template-columns:1fr}
  .horm-bars{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bg-particles" aria-hidden="true">
  <i style="left:6%;width:22px;height:22px;animation-duration:16s"></i>
  <i style="left:19%;width:34px;height:34px;animation-duration:21s;animation-delay:-6s"></i>
  <i style="left:36%;width:16px;height:16px;animation-duration:14s;animation-delay:-3s"></i>
  <i style="left:58%;width:28px;height:28px;animation-duration:19s;animation-delay:-9s"></i>
  <i style="left:76%;width:20px;height:20px;animation-duration:15s;animation-delay:-2s"></i>
  <i style="left:90%;width:36px;height:36px;animation-duration:23s;animation-delay:-11s"></i>
</div>

<header>
  <span><strong>CIÊNCIAS • 8º ANO</strong> · Cap. 3 — Reprodução e Saúde</span>
  <select id="menu" aria-label="Selecionar slide"></select>
  <nav>
    <button id="prev">← Anterior</button>
    <button id="next">Próxima →</button>
    <button id="full">Tela cheia</button>
  </nav>
</header>
<progress id="progress" value="1" max="23"></progress>
<main id="main"></main>

<script>
const slides = [
  { id:'cover', title:'Capa: O Corpo em Transformação', eyebrow:'Capítulo 3 · Ciências · 8º Ano', time:'2 min' },
  { id:'puberty_age', title:'O que é a puberdade?', eyebrow:'Parte 1 · O Despertar', link:'Início da nossa história', time:'3 min' },
  { id:'puberty_adol', title:'Puberdade × Adolescência', eyebrow:'Parte 1 · Corpo e Mente', link:'Mas não é só o corpo que muda...', time:'2 min' },
  { id:'brain_pituitary', title:'Quem dá o comando?', eyebrow:'Parte 2 · O Maestro', link:'O que dispara essas transformações?', time:'3 min' },
  { id:'hormone_travel', title:'Mensageiros no Sangue', eyebrow:'Parte 2 · Sistema Endócrino', link:'Como o sinal viaja pelo corpo?', time:'3 min' },
  { id:'gh_thyroid', title:'O Estirão e a Energia', eyebrow:'Parte 2 · Crescimento', link:'Primeiro, o corpo acelera o crescimento...', time:'3 min' },
  { id:'sex_hormones', title:'Os Hormônios Sexuais', eyebrow:'Parte 2 · Gônadas Ativas', link:'E o sinal chega aos ovários e testículos!', time:'3 min' },
  { id:'changes_common', title:'Mudanças Comuns a Todos', eyebrow:'Parte 3 · Corpo em Ação', link:'Com os hormônios no sangue, o corpo muda...', time:'2 min' },
  { id:'changes_diff', title:'Caracteres Sexuais: Meninos × Meninas', eyebrow:'Parte 3 · Primários e Secundários', link:'Cada corpo ganha novas características...', time:'3 min' },
  { id:'male_anatomy', title:'Sistema Genital Masculino', eyebrow:'Parte 4 · Órgãos Sexuais', link:'Por dentro, os órgãos amadurecem...', time:'4 min' },
  { id:'male_journey', title:'A Viagem do Espermatozoide', eyebrow:'Parte 4 · Do Testículo à Ejaculação', link:'Qual caminho o gameta masculino faz?', time:'3 min' },
  { id:'female_anatomy', title:'Sistema Genital Feminino Interno', eyebrow:'Parte 4 · Órgãos Sexuais', link:'Agora, o sistema genital feminino...', time:'4 min' },
  { id:'female_vulva', title:'Vulva e Cuidados Íntimos', eyebrow:'Parte 4 · Proteção e Saúde', link:'E por fora, como o corpo se protege?', time:'2 min' },
  { id:'cycle_overview', title:'O Ciclo Menstrual', eyebrow:'Parte 5 · O Ritmo Mensal', link:'Com os ovários ativos, começa um ciclo...', time:'3 min' },
  { id:'ovulation_anim', title:'A Viagem do Ovócito (Ovulação)', eyebrow:'Parte 5 · Dia 14', link:'O que acontece no meio do ciclo?', time:'3 min' },
  { id:'cycle_sim', title:'Simulador do Ciclo (28 dias)', eyebrow:'Parte 5 · Laboratório Interativo', link:'Veja hormônios e útero dia a dia!', time:'5 min' },
  { id:'cycle_summary', title:'Resumo das Fases e Climatério', eyebrow:'Parte 5 · Fechando o Ciclo', link:'Organizando tudo em 4 etapas...', time:'2 min' }
];

const quizData = [
  {
    q:'1. Qual glândula na base do encéfalo recebe sinais do sistema nervoso e libera GH, FSH e LH?',
    opts:['Tireoide','Hipófise','Próstata','Epidídimo'],
    ans:1,
    exp:'A hipófise atua como ponte entre o sistema nervoso e as demais glândulas.'
  },
  {
    q:'2. Qual mudança da puberdade é um exemplo de caractere sexual secundário?',
    opts:['Presença dos ovários desde o nascimento','Engrossamento da voz e alargamento dos quadris','Produção de urina nos rins','Batimento do coração'],
    ans:1,
    exp:'Caracteres secundários são mudanças externas estimuladas pela testosterona e pelos estrógenos.'
  },
  {
    q:'3. Qual é o trajeto correto dos espermatozoides até a ejaculação?',
    opts:['Testículos → epidídimos → ductos deferentes → uretra','Próstata → testículos → uretra → epidídimos','Testículos → uretra → ductos deferentes → epidídimos','Bexiga → epidídimos → testículos → uretra'],
    ans:0,
    exp:'Nascem nos testículos, amadurecem nos epidídimos, passam pelos ductos deferentes e saem pela uretra.'
  },
  {
    q:'4. No sistema genital feminino, onde o ovócito é liberado e onde normalmente ocorre a fecundação?',
    opts:['Liberado no útero; fecundação na vagina','Liberado no ovário; fecundação na tuba uterina','Liberado na tuba uterina; fecundação no ovário','Liberado na vulva; fecundação no útero'],
    ans:1,
    exp:'O ovário libera o ovócito (ovulação) e a tuba uterina o capta, sendo o local habitual da fecundação.'
  },
  {
    q:'5. Quando NÃO ocorre fecundação ao final do ciclo menstrual, o que provoca a menstruação?',
    opts:['Aumento brusco do hormônio GH','Queda de estrógenos e progesterona, causando descamação do endométrio','Crescimento permanente do corpo lúteo','Ruptura do hímen'],
    ans:1,
    exp:'Sem fecundação, caem estrógenos e progesterona e parte do endométrio é eliminada pela vagina.'
  }
];

let current = 0;
let sub = 0;
let timer = null;
const answers = {};
const total = slides.length + quizData.length + 1;
const $ = id => document.getElementById(id);

$('progress').max = total;
[...slides.map(s=>s.title), ...quizData.map((_,i)=>`Quiz ${i+1}`), 'Atividade Final de Revisão']
  .forEach((t,i)=>$('menu').add(new Option(`${i+1}. ${t}`, i)));

function clearTimer(){ if(timer){ clearInterval(timer); timer=null; } }

function head(s){
  return `<div class="eyebrow">
    <span>${s.eyebrow}</span>
    <span class="tag">${s.time}</span>
    ${s.link ? `<span class="story-link">↳ ${s.link}</span>` : ''}
  </div><h1>${s.title}</h1>`;
}

function render(){
  clearTimer();
  sub = 0;
  $('menu').value = current;
  $('progress').value = current + 1;
  $('prev').disabled = current === 0;
  $('next').disabled = current === total - 1;

  if(current < slides.length){
    const s = slides[current];
    const fn = views[s.id];
    $('main').innerHTML = `<div class="slide-enter">${fn(s)}</div>`;
    if(afterRender[s.id]) afterRender[s.id]();
  } else if(current < slides.length + quizData.length){
    renderQuiz(current - slides.length);
  } else {
    renderReview();
  }
}

const views = {
  cover: s => `
  <section class="cover">
    <div class="eyebrow" style="justify-content:center"><span>${s.eyebrow}</span><span class="tag">Aula ~60 min</span></div>
    <h1>A História do Corpo em <span>Transformação</span></h1>
    <p class="cover-sub">Puberdade, hormônios, órgãos sexuais e o ciclo menstrual — uma viagem interativa pelo corpo humano.</p>
    <div class="cover-cards">
      <div class="c-card">
        <svg viewBox="0 0 220 130" role="img" aria-label="Hormônios viajando no sangue">
          <path d="M15 65 Q65 30 110 65 T205 65" fill="none" stroke="#1e5e73" stroke-width="24" stroke-linecap="round"/>
          <path d="M15 65 Q65 30 110 65 T205 65" fill="none" stroke="#4ce5c4" stroke-width="3" class="a-flow"/>
          <circle cx="55" cy="52" r="9" fill="#ffcf6e" class="a-pulse"/>
          <circle cx="115" cy="67" r="7" fill="#ff85ae" class="a-float"/>
          <circle cx="168" cy="76" r="9" fill="#5cc8ff" class="a-pulse"/>
        </svg>
        <h3>1. Hormônios</h3>
        <p>O comando do cérebro e da hipófise</p>
      </div>
      <div class="c-card">
        <svg viewBox="0 0 220 130" role="img" aria-label="Crescimento e desenvolvimento">
          <g class="a-grow"><rect x="42" y="72" width="24" height="44" rx="6" fill="#5cc8ff88"/></g>
          <g class="a-grow" style="animation-delay:.3s"><rect x="98" y="48" width="24" height="68" rx="6" fill="#4ce5c4aa"/></g>
          <g class="a-grow" style="animation-delay:.6s"><rect x="154" y="24" width="24" height="92" rx="6" fill="#ffcf6ecc"/></g>
          <path d="M35 64 L110 38 L170 16" fill="none" stroke="#ffcf6e" stroke-width="3" stroke-dasharray="5 5"/>
        </svg>
        <h3>2. Corpo e Órgãos</h3>
        <p>Estirão, mudanças e sistema genital</p>
      </div>
      <div class="c-card">
        <svg viewBox="0 0 220 130" role="img" aria-label="Ciclo menstrual de 28 dias">
          <g class="a-spin">
            <circle cx="110" cy="65" r="42" fill="none" stroke="#ff5c7a" stroke-width="11" stroke-dasharray="45 220"/>
            <circle cx="110" cy="65" r="42" fill="none" stroke="#ffcf6e" stroke-width="11" stroke-dasharray="80 220" stroke-dashoffset="-48"/>
            <circle cx="110" cy="65" r="42" fill="none" stroke="#4ce5c4" stroke-width="11" stroke-dasharray="120 220" stroke-dashoffset="-132"/>
          </g>
          <circle cx="110" cy="65" r="24" fill="#091f33"/>
          <text x="110" y="70" fill="#ffcf6e" font-size="14" font-weight="800" text-anchor="middle">28 d</text>
        </svg>
        <h3>3. Ciclo Menstrual</h3>
        <p>Ovulação, endométrio e menstruação</p>
      </div>
    </div>
    <div class="cover-banner">
      <svg viewBox="0 0 700 88" role="img" aria-label="Linha narrativa da aula">
        <line x1="60" y1="42" x2="640" y2="42" stroke="#4ce5c4" stroke-width="3" class="a-flow"/>
        ${[['60','Puberdade','#4ce5c4'],['205','Hormônios','#ffcf6e'],['350','Mudanças','#5cc8ff'],['495','Órgãos','#ff85ae'],['640','Ciclo','#4ce5c4']].map(([x,lbl,c])=>`
          <circle cx="${x}" cy="42" r="14" fill="#0d2942" stroke="${c}" stroke-width="3.5" class="a-pulse"/>
          <text x="${x}" y="76" fill="#d4e9f7" font-size="14" font-weight="700" text-anchor="middle">${lbl}</text>
        `).join('')}
      </svg>
    </div>
    <button class="start-btn" onclick="go(1)">Iniciar a história →</button>
  </section>`,

  puberty_age: s => `${head(s)}
  <div class="layout">
    <div class="points">
      <div class="pt">É a <strong>transição biológica</strong> entre a infância e a vida adulta.</div>
      <div class="pt fem"><strong>Meninas:</strong> costuma iniciar entre <strong>8 e 13 anos</strong>.</div>
      <div class="pt masc"><strong>Meninos:</strong> costuma iniciar entre <strong>9 e 14 anos</strong>.</div>
      <div class="pt">Cada organismo tem seu <strong>próprio ritmo</strong> — comparar-se não ajuda!</div>

        </svg>
        <div class="controls">
          ${parts.map((p,i)=>`<button class="pill-btn ${i===sub?'active':''}" onclick="setSub(${i})">${p[0]}</button>`).join('')}
        </div>
      </div>
    </div>`;
  },

  female_vulva: s => `${head(s)}
  <div class="grid-2">
    <div class="card fem">
      <h3>🌸 Vulva (Parte Externa)</h3>
      <ul>
        <li><strong>Lábios maiores e menores:</strong> protegem as aberturas internas.</li>
        <li><strong>Clitóris:</strong> estrutura muito sensível ligada ao prazer.</li>
        <li><strong>Hímen:</strong> fina dobra na entrada da vagina (formatos variados).</li>
      </ul>
    </div>
    <div class="card mint">
      <h3>🩺 Atenção e Autocuidado</h3>
      <ul>
        <li><strong>Uretra ≠ Vagina:</strong> na mulher, urina e menstruação saem por canais separados.</li>
        <li>Lavar diariamente a região externa com água e sabonete suave.</li>
        <li>Dor, coceira ou odor forte? Procure um profissional de saúde.</li>
      </ul>
    </div>
  </div>`,

  cycle_overview: s => `${head(s)}
  <div class="layout">
    <div class="points">
      <div class="pt fem"><strong>Menarca:</strong> nome dado à primeira menstruação.</div>
      <div class="pt">O ciclo se repete a cada <strong>28 a 30 dias</strong> (em média).</div>
      <div class="pt">O <strong>endométrio</strong> engrossa todo mês. Sem fecundação, descama na <strong>menstruação</strong> (Dia 1).</div>
    </div>
    <div class="art">
      <svg viewBox="0 0 440 310" role="img" aria-label="Roda do ciclo menstrual">
        <g class="a-spin">
          <circle cx="220" cy="155" r="102" fill="none" stroke="#ff5c7a" stroke-width="24" stroke-dasharray="110 530"/>
          <circle cx="220" cy="155" r="102" fill="none" stroke="#ffcf6e" stroke-width="24" stroke-dasharray="180 530" stroke-dashoffset="-115"/>
          <circle cx="220" cy="155" r="102" fill="none" stroke="#4ce5c4" stroke-width="24" stroke-dasharray="330 530" stroke-dashoffset="-300"/>
        </g>
        <circle cx="220" cy="155" r="70" fill="#0b2236"/>
        <text x="220" y="150" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">Ciclo</text>
        <text x="220" y="174" fill="#ffcf6e" font-size="15" font-weight="700" text-anchor="middle">~28 dias</text>
        <text x="340" y="65" fill="#ff8fa3" font-size="13.5" font-weight="700">Menstruação</text>
        <text x="335" y="255" fill="#ffcf6e" font-size="13.5" font-weight="700">Ovulação (~Dia 14)</text>
        <text x="15" y="160" fill="#4ce5c4" font-size="13.5" font-weight="700">Preparação</text>
      </svg>
    </div>
  </div>`,

  ovulation_anim: s => {
    const st = [
      { cx:110, cy:145, r:12, msg:'Dias 6–13: O FSH estimula o folículo a crescer dentro do ovário.' },
      { cx:165, cy:115, r:16, msg:'Dia 14 (OVULAÇÃO!): Pico de LH rompe o folículo e libera o ovócito.' },
      { cx:265, cy:88, r:16, msg:'Dias 15–17: As fímbrias captam o ovócito, que viaja pela tuba uterina.' },
      { cx:385, cy:140, r:14, msg:'Sem fecundação: o ovócito se degenera e o corpo se prepara para reiniciar.' }
    ][sub];
    return `${head(s)}
    <div class="art" style="min-height:330px">
      <svg viewBox="0 0 480 230" role="img" aria-label="Animação da ovulação e trajeto na tuba uterina">
        <!-- Ovário -->
        <ellipse cx="110" cy="145" rx="58" ry="42" fill="#7a2c4b" stroke="#ff85ae" stroke-width="3"/>
        <text x="110" y="208" fill="#ffc2d6" font-size="14" font-weight="700" text-anchor="middle">Ovário</text>
        <!-- Tuba uterina -->
        <path d="M168 110 C210 60,310 60,365 115 L395 145" fill="none" stroke="#ff85ae" stroke-width="28" stroke-linecap="round" opacity=".35"/>
        <path d="M168 110 C210 60,310 60,365 115 L395 145" fill="none" stroke="#ffcf6e" stroke-width="3" class="a-flow"/>
        <!-- Útero -->
        <ellipse cx="415" cy="155" rx="42" ry="52" fill="#943456" stroke="#ff85ae" stroke-width="2.5"/>
        <text x="415" y="160" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Útero</text>
        <!-- Ovócito -->
        <circle cx="${st.cx}" cy="${st.cy}" r="${st.r}" fill="#ffcf6e" stroke="#fff" stroke-width="2.5" class="a-pulse"/>
      </svg>
      <p class="caption">${st.msg}</p>
      <div class="controls">
        <button onclick="playSteps(4,2000)" id="playBtn">▶ Animar ovulação</button>
        ${[0,1,2,3].map(i=>`<button class="pill-btn ${i===sub?'active':''}" onclick="setSub(${i})">Passo ${i+1}</button>`).join('')}
      </div>
    </div>`;
  },

  cycle_sim: s => {
    const day = (sub >= 1 && sub <= 28) ? sub : 14;
    let phase='', msg='', endo=22, fsh=25, lh=20, est=25, pro=15;
    if(day <= 5){
      phase='Fase Menstrual (Dias 1–5)';
      msg='Hormônios baixos → parte do endométrio descama (menstruação).';
      endo = 20 + (5 - day) * 5;
      fsh = 35; lh = 18; est = 20; pro = 12;
    } else if(day <= 13){
      phase='Fase Proliferativa (Dias 6–13)';
      msg='FSH ativa o folículo → Estrógenos sobem e reconstroem o endométrio.';
      endo = 24 + (day - 5) * 6;
      fsh = 55; lh = 32; est = 45 + (day - 6) * 7; pro = 18;
    } else if(day === 14){
      phase='OVULAÇÃO (~Dia 14)';
      msg='Pico de LH! O ovário libera o ovócito secundário na tuba uterina.';
      endo = 74;
      fsh = 70; lh = 100; est = 88; pro = 35;
    } else {
      phase='Fase Secretora (Dias 15–28)';
      msg = day < 25 ? 'Corpo lúteo produz Progesterona → endométrio fica bem espesso.' : 'Sem fecundação → hormônios caem e o ciclo reinicia em breve.';
      endo = day < 25 ? 88 : 88 - (day - 24) * 11;
      fsh = 25; lh = 22; est = day < 25 ? 65 : 28; pro = day < 25 ? 92 : 25;
    }
    return `${head(s)}
    <div class="sim-box">
      <div class="slider-row">
        <span class="day-pill">Dia ${day}</span>
        <input type="range" id="dayRange" min="1" max="28" value="${day}" aria-label="Dia do ciclo">
        <button onclick="toggleCyclePlay()" id="playCycle">▶ Reproduzir</button>
        <button onclick="setDay(1)">Dia 1</button>
        <button onclick="setDay(14)">Dia 14</button>
        <button onclick="setDay(22)">Dia 22</button>
      </div>
      <div class="grid-2" style="align-items:center">
        <div>
          <h2 style="color:var(--gold)">${phase}</h2>
          <p style="font-size:18px;margin:6px 0 10px;color:#e6f3ff">${msg}</p>
          <div class="horm-bars">
            <div class="hbar"><span>FSH</span><div class="hbar-track"><div class="hbar-fill" style="height:${fsh}%;background:#5cc8ff"></div></div></div>
            <div class="hbar"><span>LH</span><div class="hbar-track"><div class="hbar-fill" style="height:${lh}%;background:#ffcf6e"></div></div></div>
            <div class="hbar"><span>Estrógeno</span><div class="hbar-track"><div class="hbar-fill" style="height:${est}%;background:#ff85ae"></div></div></div>
            <div class="hbar"><span>Progest.</span><div class="hbar-track"><div class="hbar-fill" style="height:${pro}%;background:#4ce5c4"></div></div></div>
          </div>
        </div>
        <div class="art" style="min-height:230px;padding:12px">
          <svg viewBox="0 0 420 205" role="img" aria-label="Endométrio no dia ${day}">
            <rect x="15" y="10" width="390" height="165" rx="14" fill="#07192b" stroke="#305d7a"/>
            <rect x="25" y="148" width="370" height="20" fill="#732743"/>
            <rect x="25" y="${148-endo}" width="370" height="${endo}" fill="${day<=5?'#ff5c7a':'#ff85ae'}" opacity=".9"/>
            <text x="210" y="${142-endo/2}" fill="#122230" font-size="14" font-weight="800" text-anchor="middle">Endométrio</text>
            ${day<=5 ? `<g fill="#ff5c7a"><circle cx="120" cy="115" r="5" class="a-drop"/><circle cx="210" cy="110" r="6" class="a-drop" style="animation-delay:.4s"/><circle cx="300" cy="115" r="5" class="a-drop" style="animation-delay:.8s"/></g>`:''}
            ${day===14 ? `<circle cx="210" cy="36" r="15" fill="#ffcf6e" class="a-pulse"/><text x="210" y="41" fill="#122230" font-size="11" font-weight="800" text-anchor="middle">Óvulo</text>`:''}
            <text x="210" y="195" fill="#b8d4e3" font-size="13.5" text-anchor="middle">Parede do Útero · Dia ${day} de 28</text>
          </svg>
        </div>
      </div>
    </div>`;
  },

  cycle_summary: s => `${head(s)}
  <table>
    <thead><tr><th>Fase</th><th>Hormônio-chave</th><th>O que acontece?</th></tr></thead>
    <tbody>
      <tr><td><strong>1. Menstrual (1–5)</strong></td><td>Queda hormonal</td><td>Descamação do endométrio (menstruação).</td></tr>
      <tr><td><strong>2. Proliferativa (6–13)</strong></td><td>FSH e Estrógenos</td><td>Folículo cresce; endométrio se reconstrói.</td></tr>
      <tr><td><strong>3. Ovulação (~14)</strong></td><td>Pico de LH</td><td>Ovário libera o ovócito na tuba uterina.</td></tr>
      <tr><td><strong>4. Secretora (15–28)</strong></td><td>Progesterona</td><td>Endométrio espesso e vascularizado.</td></tr>
    </tbody>
  </table>
  <div class="pt" style="margin-top:16px"><strong>Climatério (~50 anos):</strong> diminuição natural dos hormônios ovarianos e encerramento gradual dos ciclos menstruais.</div>`
};

const afterRender = {
  cycle_sim: () => {
    const r = $('dayRange');
    if(r) r.oninput = e => { clearTimer(); setDay(Number(e.target.value)); };
  }
};

window.setSub = n => { clearTimer(); sub = n; renderKeepSub(); };
window.setDay = d => { sub = d; renderKeepSub(); };
function renderKeepSub(){
  const s = slides[current];
  $('main').innerHTML = views[s.id](s);
  if(afterRender[s.id]) afterRender[s.id]();
}
window.playSteps = (count, ms) => {
  if(timer){ clearTimer(); renderKeepSub(); return; }
  sub = 0; renderKeepSub();
  timer = setInterval(()=>{
    sub++;
    if(sub >= count){ clearTimer(); sub = count-1; }
    renderKeepSub();
  }, ms);
};
window.toggleCyclePlay = () => {
  if(timer){ clearTimer(); renderKeepSub(); return; }
  if(sub < 1 || sub >= 28) sub = 1;
  renderKeepSub();
  timer = setInterval(()=>{
    sub = sub >= 28 ? 1 : sub + 1;
    renderKeepSub();
  }, 550);
};

function renderQuiz(idx){
  const q = quizData[idx], a = answers[idx] || {};
  $('main').innerHTML = `<div class="slide-enter">
    <div class="eyebrow"><span>Quiz Interativo · ${idx+1} de ${quizData.length}</span><span class="tag">2 min</span></div>
    <h1>${q.q}</h1>
    <div class="options">
      ${q.opts.map((o,i)=>{
        let c='option';
        if(a.choice===i) c+=' selected';
        if(a.checked){ if(i===q.ans) c+=' correct'; else if(i===a.choice) c+=' wrong'; }
        return `<button class="${c}" onclick="pick(${idx},${i})"><strong>${'ABCD'[i]}.</strong> ${o}</button>`;
      }).join('')}
    </div>
    <div class="controls" style="justify-content:flex-start;margin-top:18px">
      <button onclick="check(${idx})" ${a.choice===undefined?'disabled':''}>Conferir resposta</button>
      <button onclick="retry(${idx})">Tentar novamente</button>
    </div>
    ${a.checked ? `<div class="feedback"><strong>${a.choice===q.ans?'✔ Acertou!':'✖ Vamos revisar:'}</strong> ${q.exp}</div>` : ''}
  </div>`;
}
window.pick = (idx,i)=>{ answers[idx]={choice:i}; renderQuiz(idx); };
window.check = idx=>{ answers[idx].checked=true; renderQuiz(idx); };
window.retry = idx=>{ delete answers[idx]; renderQuiz(idx); };

function renderReview(){
  const score = quizData.reduce((acc,q,i)=>acc+(answers[i]?.checked && answers[i].choice===q.ans?1:0),0);
  $('main').innerHTML = `<div class="slide-enter">
    <div class="eyebrow"><span>Atividade Final · Revisão Geral</span><span class="tag">5 min</span></div>
    <h1>Feche a história no caderno!</h1>
    <p style="font-size:19px;color:#8ef2db;margin:0 0 16px">Placar do Quiz: <strong>${score} de ${quizData.length}</strong> acertos. Responda às 4 questões conectando toda a aula:</p>
    <div class="rev-grid">
      <div class="rev-card">
        <p><strong>1. Comando Hormonal:</strong> Como encéfalo, hipófise e gônadas iniciam a puberdade?</p>
        <details><summary>Ver gabarito</summary>O encéfalo sinaliza à hipófise, que libera GH, FSH e LH no sangue; FSH e LH ativam ovários (estrógenos/progesterona) e testículos (testosterona).</details>
      </div>
      <div class="rev-card">
        <p><strong>2. Mudanças no Corpo:</strong> Cite 2 mudanças comuns a todos e diferencie caracteres primários de secundários.</p>
        <details><summary>Ver gabarito</summary>Comuns: estirão, oleosidade/acne, suor e pelos. Primários são os órgãos genitais; secundários são as características externas visíveis.</details>
      </div>
      <div class="rev-card">
        <p><strong>3. Sistemas Genitais:</strong> Qual a diferença no papel da uretra entre homens e mulheres?</p>
        <details><summary>Ver gabarito</summary>No homem, a uretra conduz urina e esperma (em momentos diferentes). Na mulher, conduz apenas urina, sendo separada da vagina.</details>
      </div>
      <div class="rev-card">
        <p><strong>4. Ciclo Menstrual:</strong> O que ocorre com o endométrio quando não há fecundação?</p>
        <details><summary>Ver gabarito</summary>Os níveis de estrógenos e progesterona caem e parte do endométrio descama, sendo eliminada pela vagina (menstruação).</details>
      </div>
    </div>
  </div>`;
}

function go(n){ current = Math.max(0, Math.min(total-1, n)); render(); }
$('prev').onclick = ()=>go(current-1);
$('next').onclick = ()=>go(current+1);
$('menu').onchange = e=>go(Number(e.target.value));
$('full').onclick = ()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(()=>{});
};
document.onkeydown = e=>{
  if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); go(current+1); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); go(current-1); }
};
render();
</script>
</body>
</html>
