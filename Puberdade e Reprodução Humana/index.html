<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puberdade, Hormônios e Reprodução Humana — Ciências · 8º Ano</title>
<style>
:root{
  color-scheme:dark;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#07192b;
  --panel:#0d2740;
  --card:#11324f;
  --txt:#f3f8ff;
  --mut:#b8d4e3;
  --accent:#4ce5c4;
  --teal:#4ce5c4;
  --gold:#ffcf6e;
  --fem:#ff85ae;
  --pink:#ff85ae;
  --masc:#5cc8ff;
  --blue:#5cc8ff;
  --purple:#b99af2;
  --ok:#156b50;
  --bad:#7a3345;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at 85% 12%,#144d5e 0%,transparent 55%),
             radial-gradient(circle at 12% 85%,#1b2e59 0%,transparent 55%),
             var(--bg);
  color:var(--txt);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

/* Partículas suaves no fundo */
.bg-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-particles i{
  position:absolute;bottom:-40px;border-radius:50%;
  border:2px solid #4ce5c428;background:#4ce5c40c;
  animation:riseUp linear infinite;
}
.bg-particles i:nth-child(2n){border-color:#ffcf6e28;background:#ffcf6e0a}
.bg-particles i:nth-child(3n){border-color:#ff85ae28;background:#ff85ae0a}
@keyframes riseUp{to{transform:translateY(-115vh) rotate(120deg)}}

header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:12px 4vw;
  background:#061423d8;backdrop-filter:blur(10px);
  border-bottom:1px solid #ffffff1e;font-size:14px;
}
header nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header select{max-width:310px;min-width:170px}
.slide-count{color:var(--mut);font-size:13.5px;font-weight:700;padding:0 6px;white-space:nowrap}
button,select{
  font:inherit;background:#163b52;color:#fff;
  border:1px solid #6b93a8;border-radius:12px;
  padding:8px 14px;cursor:pointer;
  transition:background .2s,border-color .2s,transform .12s;
}
button:hover:not(:disabled){background:#22617a;border-color:var(--accent)}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold)}
button:disabled{opacity:.38;cursor:default}
progress{width:100%;height:6px;display:block;accent-color:var(--accent);background:#0c253d;border:none;position:relative;z-index:19}

main{
  position:relative;z-index:1;
  flex:1;width:100%;max-width:1220px;margin:0 auto;
  padding:2.5vh 4.5vw 4.5vh;
  display:flex;flex-direction:column;justify-content:center;
}
.slide-enter{animation:slideFade .45s cubic-bezier(.16,1,.3,1)}
@keyframes slideFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.eyebrow{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  color:var(--accent);letter-spacing:2px;text-transform:uppercase;
  font-weight:700;font-size:12.5px;
}
.tag{
  background:var(--gold);color:#142230;
  padding:3px 10px;border-radius:999px;font-size:11.5px;
  font-weight:800;letter-spacing:.4px;
}
.story-link{
  font-size:13px;color:#b2f5e6;background:#113a4f;
  border:1px solid #4ce5c444;padding:3px 12px;border-radius:999px;
  text-transform:none;letter-spacing:0;font-weight:500;
}
h1{font-size:clamp(28px,3.8vw,52px);line-height:1.1;margin:10px 0 18px}
h2{font-size:clamp(20px,2.4vw,30px);margin:0 0 10px}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.layout{display:grid;grid-template-columns:.92fr 1.15fr;gap:3vw;align-items:center}
.points{display:flex;flex-direction:column;gap:12px}
.pt{
  background:#0c253bcc;border:1px solid #4f7b9444;border-left:4px solid var(--accent);
  border-radius:16px;padding:14px 16px;
  font-size:clamp(17px,1.65vw,22px);line-height:1.45;
}
.pt strong{color:var(--gold)}
.pt.fem{border-left-color:var(--fem)}
.pt.masc{border-left-color:var(--masc)}
.lead{font-size:clamp(18px,1.75vw,23px);line-height:1.45;margin:0 0 12px;color:#e5f2fc}
.lead strong{color:var(--gold)}

.art{
  background:linear-gradient(155deg,#0d2a42cc,#081d31e6);
  border:1px solid #6fa3bd38;border-radius:26px;
  padding:18px;min-height:340px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 16px 40px #00000044;position:relative;overflow:hidden;
}
.art svg{width:100%;max-height:420px;display:block}
.caption{
  font-size:clamp(14.5px,1.35vw,18px);color:var(--gold);
  text-align:center;margin:12px 0 0;font-weight:600;min-height:1.4em;
}
.stepcap{
  font-size:clamp(16px,1.6vw,21px);min-height:2.5em;
  margin:12px 4px 2px;color:var(--gold);text-align:center;font-weight:600;
}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.pill-btn.active,.tabs button[aria-pressed="true"],.chips button[aria-pressed="true"]{
  background:#1f6f82;border-color:var(--gold);box-shadow:0 0 0 2px #ffcf6e44;
}

/* CAPA (Apresentação 1 no estilo da Apresentação 2) */
.cover{max-width:1080px;margin:auto;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:8px 0}
.cover h1{margin:0 auto 14px;font-size:clamp(34px,5vw,66px);letter-spacing:-1.5px;line-height:1.08}
.cover h1 span{color:var(--fem)}
.cover-sub{color:var(--accent);font-size:clamp(19px,2.2vw,27px);margin:0 auto 24px;max-width:860px;line-height:1.35}
.cover-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;width:min(100%,860px);margin:0 auto}
.cover figure{margin:0}
.cover-card{
  border:1px solid #59879e55;border-radius:18px;
  background:linear-gradient(150deg,#123d56,#091f33);
  aspect-ratio:1.15;overflow:hidden;
  box-shadow:0 12px 28px #00000033;
  transition:transform .25s,border-color .25s;
}
.cover-card:hover{transform:translateY(-4px);border-color:var(--accent)}
.cover-card svg{width:100%;height:100%;display:block}
.cover figcaption{color:#d0e3f0;font-size:clamp(14px,1.5vw,18px);font-weight:600;padding:10px 0}
.cover-actions{margin-top:14px}
.cover-credit{color:var(--mut);font-size:13.5px;margin:16px 0 0}
.start-btn{
  background:linear-gradient(135deg,#198270,#26a68d);border:2px solid #7cf2d8;
  font-size:20px;font-weight:700;padding:13px 30px;border-radius:16px;
  box-shadow:0 8px 24px #19827055;
}
.start-btn:hover:not(:disabled){background:linear-gradient(135deg,#219984,#2ec2a5)}

/* Cards, Grids, Abas e Chips */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.card{
  background:#0c253bcc;border:1px solid #547e9655;border-radius:20px;padding:18px;
  animation:pop .55s both;
}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}.card:nth-child(5){animation-delay:.32s}.card:nth-child(6){animation-delay:.4s}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}
.card.fem{border-color:#ff85ae88}
.card.masc{border-color:#5cc8ff88}
.card.mint{border-color:#4ce5c488}
.card h2{color:var(--accent);font-size:clamp(19px,1.9vw,24px);margin:0 0 8px}
.card h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,23px)}
.card ul{margin:0;padding-left:18px}
.card li,.card p{font-size:clamp(16px,1.45vw,19.5px);line-height:1.45;margin:6px 0;color:#dcebf7}
.card .ico{font-size:36px;line-height:1;margin-bottom:8px}

.tabs,.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.chips button{padding:8px 13px;font-size:15px}

.info{
  background:#0c253be6;border:1px solid #4f7b9444;border-left:4px solid var(--gold);
  border-radius:0 16px 16px 0;padding:14px 18px;
  font-size:clamp(16.5px,1.55vw,21px);line-height:1.48;min-height:118px;color:#e8f3fc;
}
.info b{color:var(--gold);display:block;font-size:1.1em;margin-bottom:4px}

.sort{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}
.sort button{min-height:76px;font-size:clamp(15.5px,1.5vw,20px);font-weight:600}
.sort button.pri{background:#4d2966;border-color:var(--purple)}
.sort button.sec{background:#18574c;border-color:var(--accent)}

.warn{
  background:#3b1e2ecc;border:1px solid #ff85ae88;border-radius:16px;
  padding:12px 16px;margin-top:14px;font-size:clamp(15.5px,1.45vw,19px);line-height:1.48;color:#fbeaf0;
}
.warn strong{color:#ff9fb8}

.part{cursor:pointer;transition:filter .2s}
.part:hover{filter:brightness(1.22)}
.sel{filter:drop-shadow(0 0 8px #ffcf6e) brightness(1.2)}

.range{width:100%;accent-color:var(--gold);cursor:pointer;margin-top:12px}
.slider-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.slider-row input[type=range]{flex:1;min-width:180px;margin-top:0}
.day-pill{background:var(--gold);color:#122230;font-weight:800;padding:6px 14px;border-radius:12px;font-size:17px}

/* Quiz */
.quiz-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.quiz-dots{display:flex;gap:8px;flex-wrap:wrap}
.qdot{min-width:38px;height:36px;padding:0 10px;border-radius:10px;font-weight:700;font-size:14px;background:#12314a;border:1px solid #59859e}
.qdot.cur{border:2px solid var(--gold);box-shadow:0 0 0 2px #ffcf6e33}
.qdot.ok{background:var(--ok);border-color:#68ebc5}
.qdot.err{background:var(--bad);border-color:#ff8fa3}
.score-pill{background:#0f2e47;border:1px solid #4ce5c455;border-radius:999px;padding:6px 14px;font-size:14.5px;font-weight:700;color:var(--accent)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.option{text-align:left;padding:18px 20px;font-size:clamp(17px,1.65vw,21px);line-height:1.35}
.option.locked{cursor:default}
.selected{border:3px solid var(--gold)}
.correct{background:var(--ok)!important;border-color:#68ebc5}
.wrong{background:var(--bad)!important;border-color:#ff8fa3}
.btn-primary{background:linear-gradient(135deg,#198270,#26a68d);border-color:#7cf2d8;font-weight:700}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,#219984,#2ec2a5)}
.feedback{
  margin-top:14px;padding:14px 18px;border-radius:14px;
  background:#0e2e45;border-left:4px solid var(--accent);
  font-size:clamp(17px,1.65vw,21px);color:#bdf5e6;min-height:54px;
}

/* Atividade de revisão final e Notas do professor */
.rev-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:#0c253bcc;border:1px solid #4f7b9444;border-radius:18px;
  padding:14px 18px;margin-bottom:16px;
}
.rev-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rev-card{background:#0c253bcc;border:1px solid #4d789155;border-radius:18px;padding:18px}
.rev-card p{margin:0;font-size:18px;line-height:1.45;color:#e6f3ff}
.rev-card strong{color:var(--gold)}

details.notes{
  background:#0b2439cc;border:1px solid #4f7b9444;border-radius:14px;
  padding:10px 16px;margin-top:16px;font-size:15.5px;line-height:1.55;color:#cde4f2;
}
details.notes summary{cursor:pointer;font-weight:700;color:var(--accent)}
details.notes p{margin:8px 0 0}

/* ANIMAÇÕES VETORIAIS (A1 + A2) */
@keyframes pulse{0%,100%{transform:scale(1);opacity:.78}50%{transform:scale(1.1);opacity:1}}
@keyframes pulse1{50%{transform:scale(1.07)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes dashFlow{to{stroke-dashoffset:-32}}
@keyframes dash{to{stroke-dashoffset:-36}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes swimWave{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-4px)}}
@keyframes dropFall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(32px);opacity:0}}
@keyframes growBar{0%,100%{transform:scaleY(.88)}50%{transform:scaleY(1.06)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes wig{to{transform:skewY(9deg)}}
@keyframes swim{from{transform:translateX(-40px)}to{transform:translateX(50px)}}
@keyframes fall{from{transform:translateY(0);opacity:1}to{transform:translateY(55px);opacity:0}}
@keyframes walk{from{transform:translateX(0)}to{transform:translateX(620px)}}

.a-pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-float{animation:floatY 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-flow{stroke-dasharray:8 8;animation:dashFlow 1.1s linear infinite}
.a-spin{animation:spinSlow 26s linear infinite;transform-box:fill-box;transform-origin:center}
.a-swim{animation:swimWave 1.9s ease-in-out infinite}
.a-drop{animation:dropFall 1.4s ease-in infinite}
.a-grow{animation:growBar 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}

.fade{animation:pop .7s both}
.flow{stroke-dasharray:8 10;animation:dash 1.2s linear infinite}
.pulse{animation:pulse1 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wig{animation:wig .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:right center}
.swim{animation:swim 3.5s ease-in-out infinite alternate}
.fall{animation:fall 1.8s linear infinite}
.spin{animation:spinSlow 14s linear infinite;transform-origin:130px 112px}
.walk{animation:walk 12s linear infinite}

body.reduced *,body.reduced *::before,body.reduced *::after{animation:none!important;transition:none!important}
@media(max-width:860px){
  .layout,.grid-2,.cover-cards,.options,.rev-grid{grid-template-columns:1fr}
  .sort{grid-template-columns:1fr 1fr}
  .rev-card.wide{grid-column:auto}
  .cover-cards{gap:12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cover-actions,.project-bar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.cover-actions button{padding:12px 18px;font-size:clamp(16px,1.6vw,20px)}
.model-label{font-weight:700;color:var(--gold);margin:12px 0 0}
.vote-box,.review-prompt{background:var(--panel);border:1px solid #476779;border-radius:18px;padding:clamp(16px,2vw,30px);margin-top:16px}
.vote-box .controls{justify-content:flex-start}
.vote-box h2{margin:8px 0}.vote-box p{margin:8px 0}
#voteFeedback:not(:empty){padding:10px 0;color:#baf3dd;font-weight:650}
.review-prompt>p:last-child{font-size:clamp(24px,3vw,40px);line-height:1.35;margin:.55em 0}
@keyframes lengthen{from{transform:scaleY(.65)}to{transform:scaleY(1)}}
@keyframes receptor-response{from{opacity:0}to{opacity:1}}
.cell-response{animation:receptor-response .3s 1.5s both}
.growing-bone{animation:lengthen 2.6s ease-out both;transform-origin:0 0}
.project-bar{margin-bottom:8px}
.zoom-only{display:none}
.projecting .zoom-only{display:block}
.projecting main{max-width:1440px;padding:1vh 2vw}
.projecting #main .slide-enter>h1,.projecting #main .eyebrow,.projecting .layout>:first-child,.projecting details.notes{display:none}
.projecting .layout{display:block}
.projecting #projectPanel{min-height:0;padding:8px 12px}
.projecting #projName{font-size:clamp(24px,3.4vh,42px);color:var(--gold);text-align:center;margin:0}
.projecting #projectPanel svg{height:clamp(230px,52vh,750px);max-height:none}
.projecting #projectPanel:not(.all-labels) .diagram-label[data-highlight="false"]{display:none}
.projecting .caption{font-size:15px;margin:5px 0}
.projecting .stepcap{margin:4px 0;min-height:0}
.projecting .controls{margin:5px 0}
@media(max-width:650px){
  header{padding:6px 3vw;gap:5px} header>span{display:none}
  header select{width:100%;max-width:none} header nav{gap:4px}
  header button{font-size:13px;padding:5px 8px}
  .cover-cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .cover figcaption{font-size:13px}
  .projecting #projectPanel svg{height:auto;min-height:190px}
}
</style>
</head>
<body>

<div class="bg-particles" aria-hidden="true">
  <i style="left:6%;width:22px;height:22px;animation-duration:16s"></i>
  <i style="left:19%;width:34px;height:34px;animation-duration:21s;animation-delay:-6s"></i>
  <i style="left:36%;width:16px;height:16px;animation-duration:14s;animation-delay:-3s"></i>
  <i style="left:58%;width:28px;height:28px;animation-duration:19s;animation-delay:-9s"></i>
  <i style="left:76%;width:20px;height:20px;animation-duration:15s;animation-delay:-2s"></i>
  <i style="left:90%;width:36px;height:36px;animation-duration:23s;animation-delay:-11s"></i>
</div>

<header>
  <span><strong>CIÊNCIAS • 8º ANO</strong> · Cap. 3 — Reprodução e Saúde</span>
  <select id="menu" aria-label="Selecionar slide"></select>
  <nav>
    <span id="count" class="slide-count" aria-live="polite">1 / 26</span>
    <button id="returnQuiz" hidden>↩ Voltar à questão</button>
    <button id="prev">← Anterior</button>
    <button id="next">Próxima →</button>
    <button id="motion">Reduzir movimento</button>
    <button id="full">Tela cheia</button>
  </nav>
</header>
<progress id="progress" value="1" max="26"></progress>
<main id="main"></main>

<script>
'use strict';
const $ = id => document.getElementById(id);

let current = 0;
let sub = 0;
let timers = [];
const pageStates = new Map();
function pageState(){
  if(!pageStates.has(current)) pageStates.set(current, {});
  return pageStates.get(current);
}
let reviewing = null;
let quizOnly = false;
let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const answers = {};
document.body.classList.toggle('reduced', reduced);
$('motion').textContent = reduced ? 'Ativar movimento' : 'Reduzir movimento';

function clearTimers(){
  timers.forEach(t => clearInterval(t));
  timers = [];
}

const CAP = 'Representação esquemática, fora de escala. Cores fantasia.';
const P = a => '<div class="points">' + a.map(t => '<div class="pt">' + t + '</div>').join('') + '</div>';
const two = (l, r) => '<div class="layout">' + l + '<div>' + r + '</div></div>';
const svg = (vb, inner, label) => '<svg viewBox="' + vb + '" role="img" aria-label="' + label + '">' + inner + '</svg>';
const motion = (path, dur = '2.4s') => reduced ? '' : '<animateMotion dur="' + dur + '" repeatCount="indefinite" path="' + path + '"/>';
const art = (inner, cap = CAP) => '<div class="art">' + inner + (cap ? '<p class="caption">' + cap + '</p>' : '') + '</div>';
const scene = (cap = CAP) => '<div class="art"><div id="sv" style="width:100%"></div><p id="sc" class="stepcap" aria-live="polite"></p><div class="controls" id="ctl"></div>' + (cap ? '<p class="caption">' + cap + '</p>' : '') + '</div>';

function head(s){
  return `<div class="eyebrow">
    <span>${s.eyebrow}</span>
    <span class="tag">${s.time}</span>
    ${s.link ? `<span class="story-link">↳ ${s.link}</span>` : ''}
  </div><h1>${s.title}</h1>`;
}

function noteBox(txt){
  return txt ? `<details class="notes"><summary>Notas do professor</summary><p>${txt}</p></details>` : '';
}

function stepper(caps, draw, ms = 3200){
  let i = pageState().step ?? 0, timer = null;
  const n = caps.length;
  $('ctl').innerHTML = '<button id="sb">← Etapa anterior</button><button id="sp">▶ Reproduzir sequência</button><button id="sn">Próxima etapa →</button><button id="sr">Reiniciar</button>';
  const upd = () => {
    pageState().step = i;
    $('sv').innerHTML = draw(i);
    $('sc').textContent = caps[i];
    $('sb').disabled = i === 0;
    $('sn').disabled = i === n - 1;
    if($('projName')) syncProjection();
  };
  const stop = () => {
    if(timer){ clearInterval(timer); timer = null; }
    if($('sp')) $('sp').textContent = '▶ Reproduzir sequência';
  };
  $('sb').onclick = () => { stop(); i = Math.max(0, i - 1); upd(); };
  $('sn').onclick = () => { stop(); i = Math.min(n - 1, i + 1); upd(); };
  $('sr').onclick = () => { stop(); i = 0; upd(); };
  $('sp').onclick = () => {
    if(timer){ stop(); return; }
    if(i === n - 1) i = 0;
    upd();
    $('sp').textContent = '❚❚ Pausar sequência';
    timer = setInterval(() => {
      i++;
      upd();
      if(i >= n - 1) stop();
    }, ms);
    timers.push(timer);
  };
  upd();
}

function arrowHead(x1, y1, x2, y2){
  const a = Math.atan2(y2 - y1, x2 - x1), s = 13;
  return 'M' + x2 + ',' + y2 + 'L' + (x2 - s * Math.cos(a - .45)) + ',' + (y2 - s * Math.sin(a - .45)) + 'L' + (x2 - s * Math.cos(a + .45)) + ',' + (y2 - s * Math.sin(a + .45)) + 'Z';
}
function arrow(x1, y1, x2, y2, on, col = '#4ce5c4'){
  return '<g opacity="' + (on ? 1 : .12) + '"><line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="4" class="' + (on ? 'flow' : '') + '"/><path d="' + arrowHead(x1, y1, x2, y2) + '" fill="' + col + '"/></g>';
}
function box(x, y, w, h, lines, col, on = true, fs = 18){
  const ly = y + h / 2 - (lines.length - 1) * fs * .6;
  return '<g opacity="' + (on ? 1 : .13) + '"' + (on ? ' class="fade"' : '') + '><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="14" fill="#0d2940" stroke="' + col + '" stroke-width="2.5"/>' + lines.map((t, k) => '<text x="' + (x + w / 2) + '" y="' + (ly + k * fs * 1.2 + fs * .35) + '" text-anchor="middle" fill="' + (k ? '#dbe7f3' : col) + '" font-size="' + (k ? fs - 3 : fs) + '" font-weight="' + (k ? 400 : 700) + '">' + t + '</text>').join('') + '</g>';
}
function label(x, y, t, x2, y2, on = false, anchor = 'start'){
  return '<g class="diagram-label" data-highlight="' + on + '"><line x1="' + x2 + '" y1="' + y2 + '" x2="' + (anchor === 'start' ? x - 4 : x + 4) + '" y2="' + (y - 5) + '" stroke="' + (on ? '#ffcf6e' : '#9fb7c8') + '" stroke-width="1.5"/><text x="' + x + '" y="' + y + '" font-size="16.5" fill="' + (on ? '#ffcf6e' : '#d6e4ef') + '" font-weight="' + (on ? 700 : 400) + '" text-anchor="' + anchor + '">' + t + '</text></g>';

function phase(d){
  if(d <= 5) return '<b>Fase menstrual · dias 1 a 5 (em média)</b>Como não houve fecundação no ciclo anterior, a queda da progesterona provoca a eliminação de parte do endométrio, com células e sangue: a menstruação. O 1º dia da menstruação marca o início do ciclo.';
  if(d <= 13) return '<b>Fase proliferativa</b>O <strong>FSH</strong>, produzido pela hipófise, estimula o crescimento do folículo ovariano. O folículo passa a produzir <strong>estrógenos</strong>, que promovem o crescimento do endométrio.';
  if(d === 14) return '<b>Ovulação · por volta do 14º dia</b>Sob a ação do <strong>LH</strong>, também produzido pela hipófise, o folículo se rompe e libera o ovócito secundário na tuba uterina.';
  return '<b>Fase secretória</b>O folículo rompido transforma-se em <strong>corpo lúteo</strong>, que produz estrógenos e <strong>progesterona</strong>. A progesterona estimula o desenvolvimento de vasos sanguíneos no endométrio, preparando-o para receber um embrião.' + (d >= 25 ? ' Sem fecundação, o ovócito degenera, o corpo lúteo vira corpo albicante, a progesterona cai e um novo ciclo começa.' : '');
}

  },

/* ---------- 19-25. Quiz alinhado 100% ao conteúdo da aula ---------- */

  {

      'O crescimento acelerado do folículo estimulado pelo GH.'
    ],
    ans:0,

function initClassification(){
  const items = [
    ['Testículos',1,'São órgãos do sistema genital.'], ['Pelos pubianos',0,'Seu desenvolvimento é uma mudança corporal da puberdade.'],
    ['Ovários',1,'São órgãos do sistema genital.'], ['Desenvolvimento das mamas',0,'É uma mudança corporal que ocorre na puberdade.'],
    ['Voz mais grave',0,'O crescimento da laringe altera o tom de voz.'], ['Útero',1,'É um órgão do sistema genital.'],
    ['Crescimento de pelos no rosto',0,'É uma mudança corporal associada à puberdade.'], ['Pênis',1,'É um órgão do sistema genital.']
  ];
  const st = pageState();
  st.votes ??= {};
  st.item ??= 0;
  const draw = () => {
    const [name,expected,reason] = items[st.item], choice = st.votes[st.item];
    $('voteTerm').textContent = name;
    $('voteCount').textContent = `Votação da turma · ${st.item+1} de ${items.length}`;
    $('voteFeedback').textContent = choice === undefined ? '' : `${choice === expected ? 'Acertou!' : 'Vamos conferir.'} ${expected ? 'Primário' : 'Secundário'}. ${reason}`;
    for(const b of document.querySelectorAll('[data-choice]')){
      b.disabled = choice !== undefined;
      b.setAttribute('aria-pressed',String(Number(b.dataset.choice) === choice));
    }
    $('voteBack').disabled = st.item === 0;
    $('voteNext').disabled = choice === undefined;
    $('voteNext').textContent = st.item === items.length-1 ? 'Recomeçar votação' : 'Próximo exemplo →';
  };
  document.querySelectorAll('[data-choice]').forEach(b => b.onclick = () => {st.votes[st.item] = Number(b.dataset.choice); draw();});
  $('voteBack').onclick = () => {st.item--; draw();};
  $('voteNext').onclick = () => {
    if(st.item === items.length-1){st.item = 0; st.votes = {};} else st.item++;
    draw();
  };
  draw();
}

const REVIEW = [
  'Dê um exemplo de mudança da puberdade e outro de mudança da adolescência ligada à vida social.',
  'Use setas para mostrar como a hipófise se comunica com os ovários ou os testículos.',
  'Desenhe o trajeto dos espermatozoides e marque onde entram os líquidos que formam o sêmen.',
  'Faça um esquema mostrando por onde saem a urina e o fluxo menstrual no corpo feminino.',
  'Represente em três quadros o que acontece no ovário e no útero entre a ovulação e a próxima menstruação.',
  'Escolha um cuidado de saúde estudado e explique por que ele é importante.'
];
const total = slides.length + QUIZ.length + 1;
const quizStart = slides.length;
const firstQuiz = [0,1,2];
const secondQuiz = [3,4,5,6];
const names = [...slides.map(s=>s.menu), ...QUIZ.map((_,i)=>'Quiz · Questão '+(i+1)), 'Revisão no caderno'];
const lessons = [
  {name:'Aula 1 · Puberdade e hormônios', pages:[...slides.slice(0,10).map((_,i)=>i), ...firstQuiz.map(i=>quizStart+i)]},
  {name:'Aula 2 · Sistemas genitais e ciclo', pages:[...slides.slice(10).map((_,i)=>i+10), ...secondQuiz.map(i=>quizStart+i), total-1]}
];
const order = lessons.flatMap(l=>l.pages);
for(const lesson of lessons){
  const group = document.createElement('optgroup');
  group.label = lesson.name;
  for(const i of lesson.pages) group.append(new Option(names[i],i));
  $('menu').append(group);
}
$('progress').max = total;
function move(by){
  const path = quizOnly && current >= quizStart ? [...firstQuiz,...secondQuiz].map(i=>quizStart+i).concat(total-1) : order;
  const target = path[path.indexOf(current)+by];
  if(target !== undefined) go(target);
}
function reviewTopic(i){
  go(QUIZ[i].review, quizStart+i);
}
$('returnQuiz').onclick = () => {if(reviewing !== null) go(reviewing);};

function quizScore(){
  return QUIZ.reduce((acc, q, i) => acc + (answers[i]?.checked && answers[i].choice === q.ans ? 1 : 0), 0);
}

function render(){
  clearTimers();
  sub = pageState().sub ?? 0;
  $('menu').value = current;
  const position = order.indexOf(current)+1;
  $('progress').value = position;
  $('count').textContent = (lessons[0].pages.includes(current) ? 'Aula 1' : 'Aula 2') + ' · ' + position + ' / ' + total;
  $('returnQuiz').hidden = reviewing === null;
  document.body.classList.remove('projecting');
  $('prev').disabled = current === 0 || (quizOnly && current === quizStart);
  $('next').disabled = current === total - 1;

  if(current < slides.length){
    const s = slides[current];
    if(s.raw){
      $('main').innerHTML = `<div class="slide-enter">${s.raw()}</div>`;
    } else {
      $('main').innerHTML = `<div class="slide-enter">${s.body(s)}</div>`;
      if(s.init) s.init();
      if([10,12,13].includes(current)) initProjection();
    }
  } else if(current < slides.length + QUIZ.length){
    renderQuiz(current - slides.length);
  } else {
    renderFinal();
  }
}

function projectionNames(){
  if(current === 10) return ['Túbulos seminíferos','Epidídimo','Ducto deferente','Glândulas seminais e próstata','Uretra'];
  return current === 12 ? Object.values(FEM).map(part=>part[0]) : externalNames;
}
function syncProjection(){
  const st = pageState();
  const names = projectionNames();
  const idx = current === 10 ? st.step ?? 0 : current === 12 ? Object.keys(FEM).indexOf(st.part) : st.external ?? 2;
  document.body.classList.toggle('projecting', !!st.expanded);
  const panel = $('projectPanel');
  panel.classList.toggle('all-labels',!!st.allLabels);
  $('projName').textContent = names[idx];
  $('projectionToggle').textContent = st.expanded ? '← Voltar à apresentação' : 'Ampliar esquema';
  $('projectionToggle').setAttribute('aria-expanded',String(!!st.expanded));
  $('labelToggle').textContent = st.allLabels ? 'Mostrar só a seleção' : 'Mostrar todos os nomes';
  $('labelToggle').setAttribute('aria-pressed',String(!!st.allLabels));
  if($('choosePart')) $('choosePart').value = idx;
  if(current === 13) $('vulvaFigure').innerHTML = vulvaSVG(st.expanded ? idx : null);
}
function initProjection(){
  const panel = document.querySelector('#main .art');
  panel.id = 'projectPanel';
  const bar = document.createElement('div');
  bar.className = 'project-bar';
  bar.innerHTML = `<button id="projectionToggle" aria-controls="projectPanel">Ampliar esquema</button>
    <button class="zoom-only" id="labelToggle">Mostrar todos os nomes</button>`;
  panel.prepend(bar);
  const title = document.createElement('h2');
  title.id = 'projName'; title.className = 'zoom-only';
  title.setAttribute('aria-live','polite');
  bar.after(title);
  if(current !== 10){
    const selector = document.createElement('select');
    selector.className = 'zoom-only';
    selector.id = 'choosePart';
    selector.setAttribute('aria-label','Estrutura em destaque');
    projectionNames().forEach((name,i)=>selector.add(new Option(name,i)));
    selector.onchange = () => {
      const i = Number(selector.value);
      if(current === 12) document.querySelectorAll('#fchips button')[i].click();
      else {pageState().external = i; syncProjection();}
    };
    bar.append(selector);
  }
  $('projectionToggle').onclick = () => {
    pageState().expanded = !pageState().expanded;
    syncProjection();
    $('projectionToggle').scrollIntoView({block:'nearest'});
  };
  $('labelToggle').onclick = () => {pageState().allLabels = !pageState().allLabels; syncProjection();};
  syncProjection();
}

function renderQuiz(idx){
  const q = QUIZ[idx], a = answers[idx] || {};
  const group = firstQuiz.includes(idx) ? firstQuiz : secondQuiz;
  const score = group.filter(i=>answers[i]?.checked && answers[i].choice === QUIZ[i].ans).length;
  $('main').innerHTML = `<div class="slide-enter">
    <div class="eyebrow"><span>Fechamento da aula · ${group.indexOf(idx)+1} de ${group.length}</span><span class="tag">${q.topic}</span></div>
    <div class="quiz-bar">
      <div class="quiz-dots">
        ${group.map(i => {
          const st = answers[i];
          let cls = 'qdot';
          if(i === idx) cls += ' cur';
          if(st?.checked) cls += (st.choice === QUIZ[i].ans ? ' ok' : ' err');
          return `<button class="${cls}" onclick="go(${slides.length + i})" aria-label="Questão ${i + 1}">${i + 1}</button>`;
        }).join('')}
      </div>
      <span class="score-pill">Acertos nesta aula: ${score} / ${group.length}</span>
    </div>
    <h1>${q.q}</h1>
    <div class="options">
      ${q.opts.map((o, i) => {
        let c = 'option';
        if(a.choice === i) c += ' selected';
        if(a.checked){
          c += ' locked';
          if(i === q.ans) c += ' correct';
          else if(i === a.choice) c += ' wrong';
        }
        return `<button class="${c}" onclick="pick(${idx},${i})" aria-pressed="${a.choice===i}"><strong>${'ABCD'[i]}.</strong> ${o}</button>`;
      }).join('')}
    </div>
    <div class="controls" style="justify-content:flex-start;margin-top:18px">
      <button onclick="check(${idx})" ${a.choice===undefined || a.checked ? 'disabled' : ''}>Conferir resposta</button>
      <button onclick="retry(${idx})" ${a.choice===undefined && !a.checked ? 'disabled' : ''}>Tentar novamente</button>
      ${a.checked ? `<button onclick="reviewTopic(${idx})">Rever conteúdo da aula ↗</button>
      <button class="btn-primary" onclick="move(1)">${idx === 2 && !quizOnly ? 'Iniciar aula 2 →' : idx < QUIZ.length - 1 ? 'Próxima questão →' : 'Ir para Revisão Final →'}</button>` : ''}
    </div>
    ${a.checked ? `<div class="feedback" aria-live="polite"><strong>${a.choice===q.ans?'✔ Correto!':'✖ Vamos revisar:'}</strong> ${q.exp}</div>` : ''}
  </div>`;
}
window.pick = (idx, i) => {
  if(answers[idx]?.checked) return;
  answers[idx] = { choice: i };
  renderQuiz(idx);
};
window.check = idx => {
  if(answers[idx]?.choice === undefined) return;
  answers[idx].checked = true;
  renderQuiz(idx);
};
window.retry = idx => { delete answers[idx]; renderQuiz(idx); };
window.resetQuiz = () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  quizOnly = true;
  pageState().question = 0;
  go(slides.length);
};

function renderFinal(){
  const i = pageState().question ?? 0;
  const score = quizScore();
  const answered = Object.values(answers).filter(a => a && a.checked).length;
  $('main').innerHTML = `<div class="slide-enter">
    <div class="eyebrow"><span>Atividade de Revisão · Em sala ou no caderno</span><span class="tag">Revisão geral</span></div>
    <h1>Revise o que estudamos na aula</h1>
    <div class="rev-toolbar">
      <div style="font-size:18px;color:#d6f5ed">
        Placar do Quiz: <strong style="color:var(--gold)">${score} de ${QUIZ.length}</strong> acertos
        <span style="color:var(--mut);font-size:15px">(${answered} de ${QUIZ.length} respondidas)</span>
      </div>
      <div class="controls" style="margin-top:0">
        <button onclick="resetQuiz()">↻ Refazer o Quiz</button>
      </div>
    </div>
    <article class="review-prompt" aria-live="polite">
      <p class="eyebrow">Questão ${i+1} de ${REVIEW.length}</p>
      <p>${REVIEW[i]}</p>
    </article>
    <div class="controls">
      <button id="revBack" ${i === 0 ? 'disabled' : ''}>← Questão anterior</button>
      <button id="revNext" ${i === REVIEW.length-1 ? 'disabled' : ''}>Próxima questão →</button>
    </div>
  </div>`;
  $('revBack').onclick = () => {pageState().question = i-1; renderFinal();};
  $('revNext').onclick = () => {pageState().question = i+1; renderFinal();};
}

window.setSub = n => {
  clearTimers();
  pageState().sub = sub = n;
  const s = slides[current];
  if(s && s.body){
    $('main').innerHTML = s.body(s);
    if(s.init) s.init();
  }
};

function go(n, returnTo = null){
  reviewing = returnTo;
  if(n < quizStart && returnTo === null) quizOnly = false;
  current = Math.max(0, Math.min(total - 1, n));
  render();
  window.scrollTo(0, 0);
}

$('prev').onclick = () => move(-1);
$('next').onclick = () => move(1);
$('menu').onchange = e => go(Number(e.target.value));
$('motion').onclick = () => {
  reduced = !reduced;
  document.body.classList.toggle('reduced', reduced);
  $('motion').textContent = reduced ? 'Ativar movimento' : 'Reduzir movimento';
  render();
};
$('full').onclick = () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
};
document.onkeydown = e => {
  if(e.key === 'Escape' && document.body.classList.contains('projecting')){ $('projectionToggle').click(); return; }
  if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); move(1); }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); move(-1); }
};

render();
</script>
</body>
</html>
