<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b35"><title>Reprodução sexuada das plantas · Professor Luciano</title><style>
:root{color-scheme:dark;--bg:#0c2029;--panel:#15343e;--text:#f2f8f2;--muted:#c5d9d4;--green:#77e3ba;--yellow:#ffcd71}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 15%,#25534e,var(--bg) 55%);color:var(--text);font:18px/1.45 system-ui,sans-serif;min-height:100vh}header,footer{display:flex;align-items:center;gap:12px;padding:12px clamp(16px,4vw,48px);background:#091a21dd}header strong{color:var(--green);margin-right:auto}button,select{font:inherit;color:var(--text);background:#244650;border:1px solid #739b91;border-radius:10px;padding:9px 13px;cursor:pointer}button:hover{background:#356257}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}button:disabled{opacity:.45;cursor:default}select{max-width:38vw}main{max-width:1450px;margin:auto;padding:clamp(20px,3vw,42px) clamp(18px,5vw,70px);min-height:calc(100vh - 135px)}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:.78rem;font-weight:800;color:var(--green)}h1{font-size:clamp(2rem,4vw,3.8rem);line-height:1.05;letter-spacing:-.035em;margin:.35em 0 .55em}h2{font-size:1.25rem;color:var(--yellow)}.layout{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,4vw,60px);align-items:center}.copy{font-size:clamp(1.05rem,1.65vw,1.45rem)}.copy p{margin:.55em 0}.art{background:#102f38;border:1px solid #507c70;border-radius:24px;padding:12px;min-height:260px;display:grid;place-items:center}.art svg{width:100%;max-height:360px}.caption{color:var(--muted);font-size:.82rem;margin:7px 4px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.stage{color:var(--yellow);font-weight:700;min-height:1.5em}.options{display:grid;gap:10px;max-width:900px}.option{text-align:left;padding:14px}.selected{border-color:var(--yellow)}.correct{background:#245e46}.wrong{background:#713d40}.feedback{min-height:3em;color:var(--yellow)}details{margin-top:18px;color:var(--muted);font-size:.95rem}summary{cursor:pointer;color:var(--green)}footer{justify-content:space-between;position:sticky;bottom:0}footer span{color:var(--muted)}.bar{height:5px;background:#26434a}.bar i{display:block;height:100%;background:var(--green);transition:width .2s}.move{animation:travel 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes travel{to{transform:translate(120px,35px)}}.pulse{animation:pulse 2.5s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}@keyframes pulse{to{transform:scale(1.09)}}.reduced *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:700px){header{flex-wrap:wrap}header strong{width:100%}select{max-width:100%;flex:1}.layout{grid-template-columns:1fr}.art{min-height:190px}.art svg{max-height:230px}main{min-height:0}footer{position:static}.copy{font-size:1rem}h1{font-size:2rem}}
</style></head><body><header><strong>CIÊNCIAS · 8º ANO</strong><label for="menu">Ir para</label><select id="menu"></select><button id="motion">Reduzir movimento</button><button id="full">Tela cheia</button></header><div class="bar"><i id="progress"></i></div><main id="main" aria-live="polite"></main><footer><button id="prev">← Anterior</button><span id="count"></span><button id="next">Próxima →</button></footer><script>
const slides=[
['A pergunta inicial','Como as plantas se reproduzem sem sair do lugar?','Flores, vento, água e animais podem participar de processos reprodutivos.|Vamos investigar como os gametas se encontram e por que os descendentes podem ser diferentes.','flor','Comece perguntando: toda planta nasce de uma semente? Nem todas; há plantas que se desenvolvem a partir de esporos ou por reprodução assexuada.'],
['Conceito fundamental','Reprodução sexuada','Gametas são células reprodutivas. A união de gametas é a fecundação.|A fecundação forma o zigoto, que se desenvolve e origina um embrião.','zigoto','A reprodução sexuada não exige necessariamente dois indivíduos distintos.'],
['Panorama','Quatro grupos de plantas','Briófitas: musgos; pteridófitas: samambaias.|Gimnospermas: araucárias; angiospermas: plantas com flores e frutos.','grupos','Os nomes agrupam exemplos didáticos; há grande diversidade em cada grupo.'],
['Compare','Esporos, sementes, flores e frutos','Musgos e samambaias produzem esporos e não produzem sementes.|Gimnospermas e angiospermas produzem sementes; flores e frutos são características das angiospermas.','grupos','Esporo não é semente: ele é uma célula; a semente contém um embrião e outros tecidos.'],
['Água e gametas','Musgos e samambaias','Nesses grupos, anterozoides deslocam-se em uma película de água até a oosfera.|Após a fecundação ocorre desenvolvimento do esporófito, que produz esporos.','agua','Nos ciclos desses grupos, há alternância entre gametófito e esporófito. O esporo não é gameta.'],
['Gimnospermas','Sementes sem frutos','Nas araucárias, estruturas reprodutivas chamadas estróbilos participam da reprodução.|O pólen é transportado até estruturas com óvulos; após a fecundação, formam-se sementes.','semente','As sementes não ficam encerradas em frutos. A polinização nas gimnospermas ocorre predominantemente pelo vento.'],
['Angiospermas','A flor e suas partes','Estames produzem grãos de pólen nas anteras.|O pistilo ou carpelo inclui estigma, estilete e ovário; os óvulos ficam no interior do ovário.','flor','A estrutura das flores varia; nem todas possuem estames e carpelos na mesma flor.'],
['Observe a sequência','Polinização: o pólen em viagem','Polinização é a transferência do pólen da antera para o estigma de uma flor da mesma espécie.|Ela pode ocorrer pelo vento ou por animais, como abelhas e aves.','polen','Polinização não é fecundação. Nem toda visita de um animal resulta em polinização bem-sucedida.'],
['Da polinização à fecundação','O tubo polínico','Ao chegar a um estigma compatível, o grão de pólen pode germinar e formar o tubo polínico.|O tubo cresce pelo estilete até um óvulo, conduzindo células reprodutivas masculinas.','tubo','O grão de pólen não é o gameta masculino; ele contém ou origina as células que o formarão.'],
['Da polinização à fecundação','Onde ocorre a fecundação?','No interior do óvulo, um gameta masculino une-se à oosfera, formando o zigoto.|Nas angiospermas ocorre dupla fecundação: outra união origina o tecido nutritivo chamado endosperma.','tubo','Explique a dupla fecundação apenas na profundidade adequada à turma. Não confunda o óvulo vegetal com a oosfera.'],
['Depois da fecundação','Da flor ao fruto','O zigoto desenvolve-se em embrião. Em geral, o óvulo fecundado transforma-se em semente.|O ovário desenvolve-se em fruto, que envolve as sementes.','fruto','Há exceções e variações, como frutos sem sementes; o esquema representa o caso geral.'],
['Nova geração','Semente e germinação','A semente contém o embrião, envoltórios e, geralmente, reservas nutritivas.|Com condições adequadas de água, oxigênio e temperatura, ela pode germinar.','semente','A luz pode favorecer ou inibir a germinação conforme a espécie; nem toda semente germina imediatamente.'],
['Explorando o ambiente','Como as sementes se dispersam?','Animais podem transportar frutos ou sementes; água e vento também podem levá-los a outros locais.|A dispersão pode reduzir a competição perto da planta de origem.','dispersao','Coco pela água, frutos leves pelo vento e carrapichos presos aos animais são exemplos.'],
['Comparação','Polinização não é dispersão','Polinização transporta pólen até a estrutura receptora da planta.|Dispersão transporta sementes ou frutos, geralmente depois da fecundação.','polen','Convide os estudantes a classificar a ação de uma abelha e a de um pássaro que come um fruto.'],
['Variabilidade genética','Por que os descendentes são diferentes?','Os gametas carregam combinações de material genético. Na fecundação, essas contribuições se combinam.|A reprodução sexuada geralmente produz descendentes geneticamente variados.','variacao','Autofecundação pode ocorrer; diversidade não implica que todos os descendentes sejam necessariamente distintos.'],
['Populações e ambiente','Diversidade pode fazer diferença','Em uma população variada, alguns indivíduos podem apresentar características que favoreçam a sobrevivência diante de mudanças.|Isso não garante que um indivíduo ou a população sobreviverá.','variacao','O ambiente seleciona variações já existentes; os organismos não desenvolvem uma característica porque precisam dela.'],
['Compare os processos','Sexuada e assexuada','Na reprodução sexuada, há união de gametas e novas combinações genéticas.|Na assexuada, não há união de gametas; descendentes tendem a ser geneticamente semelhantes, embora mutações possam ocorrer.','zigoto','Uma mesma espécie pode apresentar reprodução sexuada e assexuada em diferentes momentos.'],
['Cuidar da vida','Polinizadores e biodiversidade','Animais polinizadores ajudam a reprodução de muitas plantas e contribuem para a produção de alimentos.|Preservar ambientes e flores nativas favorece os polinizadores.','polen','Nem todas as plantas dependem de animais para polinização; muitas são polinizadas pelo vento.']
];
const quizzes=[
['O que é polinização?',['A união dos gametas','A transferência de pólen até o estigma','A germinação da semente','A formação do fruto'],1,'A transferência do pólen antecede a fecundação.'],
['Qual estrutura costuma originar a semente após a fecundação?',['O óvulo','A pétala','A antera','O estigma'],0,'O óvulo fecundado desenvolve-se em semente; o ovário geralmente origina o fruto.'],
['Por que musgos e samambaias precisam de água na reprodução sexuada?',['Para o anterozoide alcançar a oosfera','Para formar flores','Para que o pólen voe','Para formar frutos'],0,'O gameta masculino se desloca em uma película de água.'],
['O que transporta o tubo polínico?',['Sementes até o fruto','Células reprodutivas masculinas até o óvulo','Esporos até a folha','Água até a antera'],1,'O tubo cresce em direção ao óvulo e conduz as células reprodutivas masculinas.'],
['Qual afirmação sobre variabilidade genética é adequada?',['Garante sobrevivência em qualquer ambiente','É sempre inexistente na reprodução assexuada','Pode aumentar a chance de alguns indivíduos resistirem a mudanças','Faz todos os descendentes serem iguais'],2,'Diversidade pode favorecer a sobrevivência de alguns indivíduos, mas não é garantia.']];
const total=slides.length+quizzes.length+1;let current=0,stage=0,answers={},reduced=false,timer=null;const $=id=>document.getElementById(id);
const flower=`<path d="M300 295V175" stroke="#78be83" stroke-width="14"/><path d="M300 245q-90-65-110-15q65 5 110 35M300 220q90-65 110-15q-65 5-110 35" fill="#71be7d"/><g fill="#f18ca0" stroke="#ffd1c6" stroke-width="3"><ellipse cx="300" cy="94" rx="36" ry="67"/><ellipse cx="300" cy="94" rx="36" ry="67" transform="rotate(60 300 145)"/><ellipse cx="300" cy="94" rx="36" ry="67" transform="rotate(120 300 145)"/></g><circle cx="300" cy="145" r="35" fill="#f8c970"/><circle cx="300" cy="145" r="13" fill="#a36535"/>`;
function visual(k,s){let x=''; if(k==='flor') x=flower+'<g font-size="19" fill="#e6f6ee"><text x="385" y="55">pétala</text><text x="352" y="152">centro da flor</text><text x="315" y="278">caule</text></g>'; if(k==='polen') x='<g transform="translate(-120 0)">'+flower+'</g><g transform="translate(120 0)">'+flower+'</g><circle class="move" cx="235" cy="105" r="10" fill="#ffdd73"/><path d="M235 70 Q300 20 365 80" stroke="#ffdd73" stroke-width="4" fill="none" stroke-dasharray="8 7"/><text x="300" y="35" fill="#fff0ba" font-size="21" text-anchor="middle">pólen → estigma</text>'; if(k==='tubo') x='<path d="M265 48 Q300 20 335 48 L322 175 Q380 245 300 280 Q220 245 278 175Z" fill="#88bd88" stroke="#d6f3be" stroke-width="4"/><ellipse cx="300" cy="235" rx="27" ry="31" fill="#f3d494"/><circle cx="300" cy="235" r="9" fill="#a06eb0"/><path d="M300 50 L300 '+(s===0?65:s===1?160:225)+'" stroke="#ffdc6e" stroke-width="7" fill="none"/><circle cx="300" cy="50" r="10" fill="#ffdc6e"/><g font-size="19" fill="#effaf0"><text x="345" y="55">estigma + pólen</text><text x="340" y="142">estilete</text><text x="350" y="220">ovário</text><text x="350" y="250">óvulo · oosfera</text></g>'; if(k==='grupos') x='<g font-size="58" text-anchor="middle"><text x="100" y="115">🌿</text><text x="230" y="115">🌱</text><text x="365" y="115">🌲</text><text x="495" y="115">🌼</text></g><g fill="#e6f6ee" font-size="19" text-anchor="middle"><text x="100" y="160">Musgos</text><text x="230" y="160">Samambaias</text><text x="365" y="160">Araucárias</text><text x="495" y="160">Plantas com flor</text><text x="165" y="220">Esporos</text><text x="430" y="220">Sementes</text></g>'; if(k==='agua') x='<path d="M30 230 Q300 180 570 230V300H30Z" fill="#19516a"/><g font-size="80" text-anchor="middle"><text x="125" y="190">🌿</text><text x="470" y="190">🌱</text></g><path class="move" d="M180 222 q25 -20 45 0 t45 0" stroke="#91ead5" stroke-width="5" fill="none"/><circle cx="390" cy="225" r="19" fill="#ffcd71"/><text x="300" y="70" fill="#d9f4ea" text-anchor="middle" font-size="22">Anterozoide → oosfera</text><text x="300" y="275" fill="#d9f4ea" text-anchor="middle" font-size="19">película de água</text>'; if(k==='fruto') x='<g transform="translate(-120 0)">'+flower+'</g><path d="M260 160H340" stroke="#ffdc6e" stroke-width="5"/><path d="M325 145l20 15-20 15" fill="none" stroke="#ffdc6e" stroke-width="5"/><g class="pulse"><circle cx="450" cy="180" r="70" fill="#e86f61"/><path d="M450 110q-20-30-35-15 20 25 35 20 15 5 35-20-15-15-35 15" fill="#82d393"/><circle cx="430" cy="180" r="8" fill="#ffe4a7"/><circle cx="468" cy="190" r="8" fill="#ffe4a7"/></g><text x="450" y="285" text-anchor="middle" fill="#edf8ed" font-size="20">fruto com sementes</text>'; if(k==='semente') x='<ellipse cx="300" cy="160" rx="105" ry="70" fill="#c99659" stroke="#f0d9aa" stroke-width="5"/><ellipse cx="300" cy="160" rx="74" ry="48" fill="#f5e4b5"/><path d="M280 180q15-70 55-55q-5 40-35 40m-10 0v40" fill="#83c58c" stroke="#4a9662" stroke-width="4"/><g fill="#edf8ed" font-size="20"><text x="410" y="110">envoltório</text><text x="390" y="170">reserva</text><text x="365" y="220">embrião</text></g>'; if(k==='dispersao') x='<g font-size="72" text-anchor="middle"><text x="100" y="150">🐦</text><text x="300" y="150">💨</text><text x="500" y="150">🌊</text></g><g fill="#edf8ed" font-size="22" text-anchor="middle"><text x="100" y="215">animais</text><text x="300" y="215">vento</text><text x="500" y="215">água</text></g>'; if(k==='variacao') x='<g font-size="72" text-anchor="middle"><text x="120" y="150">🌼</text><text x="300" y="150">🌸</text><text x="480" y="150">🌻</text></g><text x="300" y="235" fill="#edf8ed" text-anchor="middle" font-size="20">Diversidade ilustrativa · cores não representam genes específicos</text>'; if(k==='zigoto') x='<circle cx="140" cy="150" r="55" fill="#80dcc2"/><circle cx="140" cy="150" r="14" fill="#477b83"/><text x="235" y="165" font-size="50" fill="#effaf0">+</text><circle cx="330" cy="150" r="55" fill="#f3c774"/><circle cx="330" cy="150" r="14" fill="#a56b92"/><text x="415" y="165" font-size="44" fill="#effaf0">→</text><circle cx="500" cy="150" r="60" fill="#c6d796"/><text x="300" y="250" text-anchor="middle" font-size="23" fill="#e5f8ed">gametas → zigoto → embrião</text>';return `<svg viewBox="0 0 600 310" role="img" aria-label="Esquema didático: ${k}">${x}</svg>`}
function stop(){clearInterval(timer);timer=null}function render(){stop();$('count').textContent=`${current+1} / ${total}`;$('progress').style.width=((current+1)/total*100)+'%';$('prev').disabled=current===0;$('next').disabled=current===total-1;$('menu').value=current;let m=$('main');if(current<slides.length){let [tag,title,copy,art,note]=slides[current];let seq=art==='tubo';m.innerHTML=`<div class="eyebrow">${tag}</div><h1>${title}</h1><div class="layout"><div class="copy">${copy.split('|').map(p=>`<p>${p}</p>`).join('')}</div><div><div class="art" id="visual">${visual(art,stage)}</div><p class="caption">Esquema ilustrativo, fora de escala. ${art==='grupos'?'Símbolos representam exemplos dos grupos.':''}</p>${seq?'<p class="stage" id="stage"></p><div class="controls"><button id="backStage">← Etapa</button><button id="play">Reproduzir sequência</button><button id="nextStage">Próxima etapa →</button><button id="reset">Reiniciar</button></div>':''}</div></div><details><summary>Notas do professor</summary><p>${note}</p></details>`;if(seq){function update(){$('visual').innerHTML=visual(art,stage);$('stage').textContent=['1. O pólen chega ao estigma.','2. O tubo cresce pelo estilete.','3. O tubo alcança o óvulo.'][stage];$('backStage').disabled=stage===0;$('nextStage').disabled=stage===2}function halt(){stop();$('play').textContent='Reproduzir sequência'}$('backStage').onclick=()=>{halt();stage=Math.max(0,stage-1);update()};$('nextStage').onclick=()=>{halt();stage=Math.min(2,stage+1);update()};$('reset').onclick=()=>{halt();stage=0;update()};$('play').onclick=()=>{if(timer){halt();return}if(stage===2)stage=0;update();$('play').textContent='Pausar sequência';timer=setInterval(()=>{stage++;update();if(stage===2)halt()},2200)};update()}}else if(current<slides.length+quizzes.length){let q=quizzes[current-slides.length],a=answers[current]||{};m.innerHTML=`<div class="eyebrow">Desafio da turma · ${current-slides.length+1} de ${quizzes.length}</div><h1>${q[0]}</h1><div class="options">${q[1].map((v,i)=>`<button class="option ${a.choice===i?'selected':''} ${a.checked&&i===q[2]?'correct':''} ${a.checked&&i===a.choice&&i!==q[2]?'wrong':''}" data-choice="${i}" aria-pressed="${a.choice===i}">${'ABCD'[i]}. ${v}</button>`).join('')}</div><div class="controls"><button id="check" ${a.choice===undefined?'disabled':''}>Conferir resposta</button><button id="retry">Responder novamente</button></div><p class="feedback" role="status">${a.checked?(a.choice===q[2]?'Correto! ':'Vamos revisar. ')+q[3]:''}</p>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[current]={choice:+b.dataset.choice};render()});$('check').onclick=()=>{answers[current].checked=true;render()};$('retry').onclick=()=>{delete answers[current];render()}}else m.innerHTML='<div class="eyebrow">Atividade final</div><h1>Explique com suas palavras</h1><ol class="copy"><li>Qual a diferença entre polinização e fecundação?</li><li>Explique o caminho do pólen até a formação da semente.</li><li>Compare a reprodução de uma samambaia e de uma planta com flor.</li><li>Como a variabilidade genética pode ajudar uma população diante de mudanças?</li></ol><details><summary>Orientações e respostas para o professor</summary><p>1. Polinização é a transferência de pólen; fecundação é a união de gametas. 2. Pólen no estigma, formação do tubo, fecundação no óvulo e desenvolvimento da semente. 3. Samambaias produzem esporos e dependem de água para o deslocamento dos gametas; angiospermas produzem pólen, sementes e frutos. 4. Alguns indivíduos podem possuir características favoráveis, sem garantia de sobrevivência.</p></details><p class="caption">Base: capítulo 2 do material de Ciências fornecido pelo professor, seções 3 e 4.</p>'}
function go(n){stage=0;current=Math.max(0,Math.min(total-1,n));render()}$('menu').innerHTML=[...slides.map((s,i)=>`<option value="${i}">${i+1}. ${s[1]}</option>`),...quizzes.map((q,i)=>`<option value="${slides.length+i}">${slides.length+i+1}. Quiz ${i+1}</option>`),`<option value="${total-1}">${total}. Atividade final</option>`].join('');$('menu').onchange=e=>go(+e.target.value);$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);$('motion').textContent=reduced?'Ativar movimento':'Reduzir movimento'};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});render();
</script></body></html>
