const challenges={1:'Gameta e zigoto são a mesma coisa?',2:'Uma samambaia produz sementes?',3:'Qual destes grupos produz frutos?',4:'O que aconteceria sem a película de água?',5:'O pinhão é fruto ou semente?',6:'Onde o pólen é produzido?',7:'Uma abelha transporta sementes ou pólen?',8:'Por que o tubo polínico é importante?',9:'Polinização já significa fecundação?',10:'O que o tomate tem a ver com uma flor?',11:'Uma semente precisa apenas de água?',12:'Como um carrapicho consegue viajar?',13:'O pássaro que come um fruto está polinizando?',14:'Irmãos precisam ser geneticamente iguais?',15:'Todos os indivíduos resistem da mesma forma a uma doença?',16:'Uma planta pode se reproduzir das duas maneiras?',17:'Como cuidar dos polinizadores perto da escola?'};
const slides=[
['A pergunta inicial','Como as plantas se reproduzem sem sair do lugar?','Flores, vento, água e animais podem participar de processos reprodutivos.|Vamos investigar como os gametas se encontram e por que os descendentes podem ser diferentes.','flor','Comece perguntando: toda planta nasce de uma semente? Nem todas; há plantas que se desenvolvem a partir de esporos ou por reprodução assexuada.'],
['Conceito fundamental','Reprodução sexuada','Gametas são células reprodutivas. A união de gametas é a fecundação.|A fecundação forma o zigoto, que se desenvolve e origina um embrião.','zigoto','A reprodução sexuada não exige necessariamente dois indivíduos distintos.'],
['Panorama','Quatro grupos de plantas','Briófitas: musgos; pteridófitas: samambaias.|Gimnospermas: araucárias; angiospermas: plantas com flores e frutos.','grupos','Os nomes agrupam exemplos didáticos; há grande diversidade em cada grupo.'],
['Compare','Esporos, sementes, flores e frutos','Musgos e samambaias produzem esporos e não produzem sementes.|Gimnospermas e angiospermas produzem sementes; flores e frutos são características das angiospermas.','grupos','Esporo não é semente: ele é uma célula; a semente contém um embrião e outros tecidos.'],
['Água e gametas','Musgos e samambaias','Nesses grupos, anterozoides deslocam-se em uma película de água até a oosfera.|Após a fecundação ocorre desenvolvimento do esporófito, que produz esporos.','agua','Nos ciclos desses grupos, há alternância entre gametófito e esporófito. O esporo não é gameta.'],
['Gimnospermas','Sementes sem frutos','Nas araucárias, estruturas reprodutivas chamadas estróbilos participam da reprodução.|O pólen é transportado até estruturas com óvulos; após a fecundação, formam-se sementes.','semente','As sementes não ficam encerradas em frutos. A polinização nas gimnospermas ocorre predominantemente pelo vento.'],
['Angiospermas','A flor e suas partes','Estames produzem grãos de pólen nas anteras.|O pistilo ou carpelo inclui estigma, estilete e ovário; os óvulos ficam no interior do ovário.','flor','A estrutura das flores varia; nem todas possuem estames e carpelos na mesma flor.'],
['Observe a sequência','Polinização: o pólen em viagem','Polinização é a transferência do pólen da antera para o estigma de uma flor da mesma espécie.|Ela pode ocorrer pelo vento ou por animais, como abelhas e aves.','polen','Polinização não é fecundação. Nem toda visita de um animal resulta em polinização bem-sucedida.'],
['Da polinização à fecundação','O tubo polínico','Ao chegar a um estigma compatível, o grão de pólen pode germinar e formar o tubo polínico.|O tubo cresce pelo estilete até um óvulo, conduzindo células reprodutivas masculinas.','tubo','O grão de pólen não é o gameta masculino; ele contém ou origina as células que o formarão.'],
['Da polinização à fecundação','Onde ocorre a fecundação?','No interior do óvulo, um gameta masculino une-se à oosfera, formando o zigoto.|Nas angiospermas ocorre dupla fecundação: outra união origina o tecido nutritivo chamado endosperma.','tubo','Explique a dupla fecundação apenas na profundidade adequada à turma. Não confunda o óvulo vegetal com a oosfera.'],
['Depois da fecundação','Da flor ao fruto','O zigoto desenvolve-se em embrião. Em geral, o óvulo fecundado transforma-se em semente.|O ovário desenvolve-se em fruto, que envolve as sementes.','fruto','Há exceções e variações, como frutos sem sementes; o esquema representa o caso geral.'],
['Nova geração','Semente e germinação','A semente contém o embrião, envoltórios e, geralmente, reservas nutritivas.|Com condições adequadas de água, oxigênio e temperatura, ela pode germinar.','semente','A luz pode favorecer ou inibir a germinação conforme a espécie; nem toda semente germina imediatamente.'],
['Explorando o ambiente','Como as sementes se dispersam?','Animais podem transportar frutos ou sementes; água e vento também podem levá-los a outros locais.|A dispersão pode reduzir a competição perto da planta de origem.','dispersao','Coco pela água, frutos leves pelo vento e carrapichos presos aos animais são exemplos.'],
['Comparação','Polinização não é dispersão','Polinização transporta pólen até a estrutura receptora da planta.|Dispersão transporta sementes ou frutos, geralmente depois da fecundação.','polen','Convide os estudantes a classificar a ação de uma abelha e a de um pássaro que come um fruto.'],
['Variabilidade genética','Por que os descendentes são diferentes?','Os gametas carregam combinações de material genético. Na fecundação, essas contribuições se combinam.|A reprodução sexuada geralmente produz descendentes geneticamente variados.','variacao','Autofecundação pode ocorrer; diversidade não implica que todos os descendentes sejam necessariamente distintos.'],
['Populações e ambiente','Diversidade pode fazer diferença','Em uma população variada, alguns indivíduos podem apresentar características que favoreçam a sobrevivência diante de mudanças.|Isso não garante que um indivíduo ou a população sobreviverá.','variacao','O ambiente seleciona variações já existentes; os organismos não desenvolvem uma característica porque precisam dela.'],
['Compare os processos','Sexuada e assexuada','Na reprodução sexuada, há união de gametas e novas combinações genéticas.|Na assexuada, não há união de gametas; descendentes tendem a ser geneticamente semelhantes, embora mutações possam ocorrer.','zigoto','Uma mesma espécie pode apresentar reprodução sexuada e assexuada em diferentes momentos.'],
['Cuidar da vida','Polinizadores e biodiversidade','Animais polinizadores ajudam a reprodução de muitas plantas e contribuem para a produção de alimentos.|Preservar ambientes e flores nativas favorece os polinizadores.','polen','Nem todas as plantas dependem de animais para polinização; muitas são polinizadas pelo vento.']
];

['Por que musgos e samambaias precisam de água na reprodução sexuada?',['Para o anterozoide alcançar a oosfera','Para formar flores','Para que o pólen voe','Para formar frutos'],0,'O gameta masculino se desloca em uma película de água.'],

function stop(){clearInterval(timer);timer=null}function render(){stop();$('count').textContent=`${current+1} / ${total}`;$('progress').style.width=((current+1)/total*100)+'%';$('prev').disabled=current===0;$('next').disabled=current===total-1;$('menu').value=current;let m=$('main');if(current===0){m.innerHTML=`<section class="cover"><div><div class="eyebrow">Ciências · 8º ano · Capítulo 2</div><h1>Reprodução sexuada<br><em>das plantas</em></h1><p class="lead">Uma viagem da flor à semente — e à diversidade da vida.</p><p><span class="pill">Polinização</span><span class="pill">Sementes</span><span class="pill">Variabilidade genética</span></p><p class="credit">Professor Luciano Costa</p><button class="primary" id="start">Vamos explorar →</button><div class="prompt">Uma planta não sai do lugar. Como seus gametas se encontram?</div></div><figure style="margin:0"><img class="coverphoto" src="${heroImage}" alt="Ilustração realista de uma abelha visitando uma flor com pólen"><figcaption class="caption">Ilustração realista gerada por IA · relação entre flor e polinizador.</figcaption></figure></section>`;$('start').onclick=()=>go(1);return;}if(current<slides.length){let [tag,title,copy,art,note]=slides[current];let seq=art==='tubo';m.innerHTML=`<div class="eyebrow">${tag}</div><h1>${title}</h1><div class="layout"><div class="copy">${copy.split('|').map(p=>`<p>${p}</p>`).join('')}</div><div><div class="art" id="visual">${[6,7,13,17].includes(current)?`<img class="photoPanel" src="${heroImage}" alt="Abelha e flor: ilustração realista de polinização">`:''}${visual(art,stage)}</div><p class="caption">Esquema ilustrativo, fora de escala. ${art==='grupos'?'Símbolos representam exemplos dos grupos.':''}</p>${seq?'<p class="stage" id="stage"></p><div class="controls"><button id="backStage">← Etapa</button><button id="play">Reproduzir sequência</button><button id="nextStage">Próxima etapa →</button><button id="reset">Reiniciar</button></div>':''}</div></div><div class="prompt">💬 ${challenges[current]||'Observe o esquema: como você explicaria esse processo a um colega?'}</div><details><summary>Notas do professor</summary><p>${note}</p></details>`;if(seq){function update(){$('visual').innerHTML=visual(art,stage);$('stage').textContent=['1. O pólen chega ao estigma.','2. O tubo cresce pelo estilete.','3. O tubo alcança o óvulo.'][stage];$('backStage').disabled=stage===0;$('nextStage').disabled=stage===2}function halt(){stop();$('play').textContent='Reproduzir sequência'}$('backStage').onclick=()=>{halt();stage=Math.max(0,stage-1);update()};$('nextStage').onclick=()=>{halt();stage=Math.min(2,stage+1);update()};$('reset').onclick=()=>{halt();stage=0;update()};$('play').onclick=()=>{if(timer){halt();return}if(stage===2)stage=0;update();$('play').textContent='Pausar sequência';timer=setInterval(()=>{stage++;update();if(stage===2)halt()},2200)};update()}}else if(current<slides.length+quizzes.length){let q=quizzes[current-slides.length],a=answers[current]||{};m.innerHTML=`<div class="eyebrow">Desafio da turma · ${current-slides.length+1} de ${quizzes.length}</div><h1>${q[0]}</h1><div class="options">${q[1].map((v,i)=>`<button class="option ${a.choice===i?'selected':''} ${a.checked&&i===q[2]?'correct':''} ${a.checked&&i===a.choice&&i!==q[2]?'wrong':''}" data-choice="${i}" aria-pressed="${a.choice===i}">${'ABCD'[i]}. ${v}</button>`).join('')}</div><div class="controls"><button id="check" ${a.choice===undefined?'disabled':''}>Conferir resposta</button><button id="retry">Responder novamente</button></div><p class="feedback" role="status">${a.checked?(a.choice===q[2]?'Correto! ':'Vamos revisar. ')+q[3]:''}</p>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[current]={choice:+b.dataset.choice};render()});$('check').onclick=()=>{answers[current].checked=true;render()};$('retry').onclick=()=>{delete answers[current];render()}}else m.innerHTML='<div class="eyebrow">Atividade final</div><h1>Explique com suas palavras</h1><ol class="copy"><li>Qual a diferença entre polinização e fecundação?</li><li>Explique o caminho do pólen até a formação da semente.</li><li>Compare a reprodução de uma samambaia e de uma planta com flor.</li><li>Como a variabilidade genética pode ajudar uma população diante de mudanças?</li></ol><details><summary>Orientações e respostas para o professor</summary><p>1. Polinização é a transferência de pólen; fecundação é a união de gametas. 2. Pólen no estigma, formação do tubo, fecundação no óvulo e desenvolvimento da semente. 3. Samambaias produzem esporos e dependem de água para o deslocamento dos gametas; angiospermas produzem pólen, sementes e frutos. 4. Alguns indivíduos podem possuir características favoráveis, sem garantia de sobrevivência.</p></details><p class="caption">Base: capítulo 2 do material de Ciências fornecido pelo professor, seções 3 e 4.</p>'}
function go(n){stage=0;current=Math.max(0,Math.min(total-1,n));render()}$('menu').innerHTML=[...slides.map((s,i)=>`<option value="${i}">${i+1}. ${s[1]}</option>`),...quizzes.map((q,i)=>`<option value="${slides.length+i}">${slides.length+i+1}. Quiz ${i+1}</option>`),`<option value="${total-1}">${total}. Atividade final</option>`].join('');$('menu').onchange=e=>go(+e.target.value);$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);$('motion').textContent=reduced?'Ativar movimento':'Reduzir movimento'};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};let touchX=0,touchY=0;document.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)*1.5)go(current+(dx<0?1:-1))},{passive:true});document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});render();
